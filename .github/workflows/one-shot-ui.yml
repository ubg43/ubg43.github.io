name: One shot UI upgrade

on: push

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upgrade index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''

/* Pro-level UBG UI polish */
:root{--ubg-blue:#0062ff;--ubg-blue-deep:#0051d8;--ink:#17213a;--muted:#76839b}
html{scroll-behavior:smooth}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background-color:#0b1731;background-attachment:fixed}
.site-header{height:auto!important;min-height:74px;padding:0 20px!important;box-sizing:border-box;background:#0062ff!important;box-shadow:0 4px 18px rgba(0,24,80,.2);display:flex;align-items:center;position:relative;z-index:1000}
.header-inner{width:100%;min-height:74px;display:flex;align-items:center;gap:10px}
.search-shell{position:relative!important;left:auto!important;top:auto!important;flex:0 1 330px;width:330px;max-width:330px;z-index:1005}
#searchBar{position:relative!important;left:auto!important;top:auto!important;width:100%!important;height:44px!important;box-sizing:border-box;padding:0 44px 0 43px!important;border:1px solid rgba(255,255,255,.82)!important;border-radius:13px!important;outline:none!important;background:#fff!important;color:var(--ink)!important;font:600 15px/44px system-ui,sans-serif!important;box-shadow:0 7px 19px rgba(0,34,102,.19),inset 0 1px 0 #fff!important;transition:transform .18s ease,box-shadow .18s ease!important}
#searchBar:focus{transform:translateY(-1px);box-shadow:0 10px 25px rgba(0,25,88,.25),0 0 0 4px rgba(255,255,255,.16)!important}
.search-results{position:absolute!important;top:calc(100% + 8px)!important;left:0!important;width:100%!important;padding:6px!important;border:1px solid rgba(20,40,80,.1)!important;border-radius:14px!important;background:rgba(255,255,255,.98)!important;box-shadow:0 18px 42px rgba(5,24,63,.25)!important;display:none;overflow:hidden}
.search-results.is-open{display:block;animation:searchDrop .16s ease-out}
@keyframes searchDrop{from{opacity:0;transform:translateY(-5px) scale(.985)}to{opacity:1;transform:none}}
.search-result{display:flex!important;align-items:center;gap:11px;width:100%;min-height:58px;padding:7px 8px;box-sizing:border-box;border:0;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;text-align:left;transition:transform .14s ease,background .14s ease!important}
.search-result:hover,.search-result.is-active{background:#f1f5fc!important;transform:scale(1.012)}
.search-result img{width:44px!important;height:44px!important;flex:0 0 44px;object-fit:cover;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.13)}
.search-result-title{display:block;font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.search-result-label{display:block;margin-top:2px;font-size:11px;color:var(--muted);font-weight:600}
.search-empty{padding:14px 10px;color:var(--muted);font-size:13px;text-align:center}
.search-icon{left:15px!important;z-index:4}
.search-clear{right:7px!important;z-index:4}
.header-actions{position:relative!important;left:auto!important;top:auto!important;right:auto!important;transform:none!important;display:flex!important;align-items:center;gap:8px;flex:0 0 auto!important;z-index:1003}
.header-action{position:relative!important;inset:auto!important;width:148px!important;min-width:148px!important;height:38px!important;padding:0 12px!important;box-sizing:border-box;display:inline-flex!important;align-items:center;justify-content:center;gap:7px;border:1px solid rgba(255,255,255,.42)!important;border-radius:11px!important;background:#0a56d8!important;color:#fff!important;font:750 13px/1 system-ui,sans-serif!important;cursor:pointer;white-space:nowrap;box-shadow:0 5px 14px rgba(0,30,100,.2),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .16s ease,background .16s ease,box-shadow .16s ease!important}
.header-action:hover{transform:translateY(-2px) scale(1.035)!important;background:#0950c7!important;box-shadow:0 9px 21px rgba(0,30,100,.28),inset 0 1px 0 rgba(255,255,255,.26)!important}
.header-action:active{transform:translateY(1px) scale(.98)!important}
.action-icon{font-size:15px;line-height:1}
.mc-text{margin-left:auto!important;position:relative!important;left:auto!important;top:auto!important;transform:rotate(-12deg)!important;white-space:nowrap;font-family:"Pixelify Sans",system-ui,sans-serif;font-weight:800;font-size:16px;background:linear-gradient(90deg,#fff,#8dd3ff,#fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:2px 2px 0 #000;filter:drop-shadow(2px 2px 0 #000);animation:splash 1.2s infinite ease-in-out}
.game-grid{gap:17px!important;padding:22px!important}
.game-card{border-radius:14px!important;box-shadow:0 5px 16px rgba(0,0,0,.12)!important;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease!important}
.game-card:hover{transform:translateY(-6px) scale(1.025)!important;box-shadow:0 15px 30px rgba(3,20,55,.24)!important}
.game-card img{transition:transform .22s ease,filter .22s ease!important}.game-card:hover img{transform:scale(1.04);filter:saturate(1.05)}
.game-card h3{font-size:15px;line-height:1.3;color:#172039}
.search-recommendations{display:none;padding:4px 22px 30px}.search-recommendations.is-visible{display:block;animation:recommendIn .2s ease-out}.search-recommendations-header{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:5px 0 12px}.search-recommendations-title{margin:0;color:#fff;font:800 20px/1.2 system-ui,sans-serif;text-shadow:0 2px 5px rgba(0,0,0,.24)}.search-recommendations-subtitle{margin:0;color:rgba(255,255,255,.72);font:600 12px/1.2 system-ui,sans-serif}.search-recommendations-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:13px}.search-recommendation{appearance:none;width:100%;padding:0;overflow:hidden;border:0;border-radius:13px;background:#fff;text-align:left;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.12);transition:transform .18s ease,box-shadow .18s ease}.search-recommendation:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 13px 24px rgba(0,0,0,.2)}.search-recommendation img{display:block;width:100%;height:112px;object-fit:cover}.search-recommendation span{display:block;padding:9px 10px 11px;color:#1b2740;font:750 13px/1.25 system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{background:#0062ff!important}
@media(max-width:1050px){.search-shell{flex-basis:280px;width:280px;max-width:280px}.header-action{width:138px!important;min-width:138px!important}.mc-text{font-size:14px}}
@media(max-width:830px){.site-header{padding:11px 14px!important}.header-inner{min-height:0;flex-wrap:wrap}.search-shell{order:1;flex:1 1 100%;width:100%;max-width:none}.header-actions{order:2;flex:1 1 auto!important}.header-action{width:148px!important;min-width:0!important}.mc-text{order:3;margin-left:auto!important;margin-right:4px!important}}
@media(max-width:570px){.header-actions{width:100%;display:grid!important;grid-template-columns:1fr 1fr}.header-action{width:100%!important}.mc-text{display:none}.search-recommendations{padding-left:14px;padding-right:14px}.search-recommendations-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.search-recommendation img{height:92px}}
@keyframes recommendIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
'''
          if '/* Pro-level UBG UI polish */' not in s:
              s=s.replace('</style>',css+'\n</style>',1)

          header='''<header class="site-header">\n  <div class="header-inner">\n    <div class="search-shell" role="search">\n      <span class="search-icon" aria-hidden="true"></span>\n      <input type="search" id="searchBar" placeholder="Search games..." autocomplete="off" spellcheck="false" aria-label="Search games" aria-controls="searchResults" aria-expanded="false">\n      <button class="search-clear" id="searchClear" type="button" aria-label="Clear search">×</button>\n      <div class="search-results" id="searchResults" role="listbox" aria-label="Game suggestions"></div>\n    </div>\n    <nav class="header-actions" aria-label="Game actions">\n      <button onclick="openRandom()" class="header-action" type="button"><span class="action-icon" aria-hidden="true">🎲</span><span>Random Game</span></button>\n      <button onclick="window.location.href='mailto:ubg423@gmail.com?subject=UBG%20Problem%20%2F%20Game%20Suggestion'" class="header-action" type="button"><span class="action-icon" aria-hidden="true">📝</span><span>Report / Suggest</span></button>\n    </nav>\n    <div class="mc-text">Lil croak was here!</div>\n  </div>\n</header>'''
          s=re.sub(r'<header\b[^>]*>.*?</header>',header,s,count=1,flags=re.S)

          section='''<section id="searchRecommendations" class="search-recommendations" aria-live="polite">\n  <div class="search-recommendations-header">\n    <h2 class="search-recommendations-title">You may also like</h2>\n    <p class="search-recommendations-subtitle">More games to try</p>\n  </div>\n  <div class="search-recommendations-grid" id="searchRecommendationsGrid"></div>\n</section>\n'''
          if 'id="searchRecommendations"' not in s:
              s=s.replace('<footer>',section+'<footer>',1)

          js=r'''<script>
(function(){
  const input=document.getElementById('searchBar'),results=document.getElementById('searchResults'),clear=document.getElementById('searchClear'),grid=document.getElementById('gameGrid'),recWrap=document.getElementById('searchRecommendations'),recGrid=document.getElementById('searchRecommendationsGrid');
  if(!input||!results||!clear||!grid)return;
  const norm=v=>(v||'').toString().trim().toLowerCase();
  const games=()=>Array.from(grid.querySelectorAll(':scope > .game-card')).map((card,index)=>({card,index,title:(card.querySelector('h3')?.textContent||card.querySelector('img')?.alt||'Game').trim(),image:card.querySelector('img')?.currentSrc||card.querySelector('img')?.src||''}));
  const rank=(title,q)=>{const t=norm(title),n=norm(q),tw=t.split(/\s+/),qw=n.split(/\s+/).filter(Boolean);if(t===n)return 0;if(t.startsWith(n))return 1;if(tw.some(w=>w.startsWith(n)))return 2;const overlap=qw.filter(x=>tw.some(w=>w.includes(x))).length;if(overlap===qw.length&&overlap)return 2.5;if(t.includes(n))return 3;return 99};
  const matches=q=>games().map(g=>({...g,score:rank(g.title,q)})).filter(g=>g.score<99).sort((a,b)=>a.score-b.score||a.title.localeCompare(b.title));
  const close=()=>{results.classList.remove('is-open');input.setAttribute('aria-expanded','false')};
  function renderSuggestions(q){results.innerHTML='';if(!q){close();return}const top=matches(q).slice(0,5);if(!top.length){results.innerHTML='<div class="search-empty">No matching games yet</div>';results.classList.add('is-open');input.setAttribute('aria-expanded','true');return}top.forEach((game,i)=>{const b=document.createElement('button');b.type='button';b.className='search-result';b.setAttribute('role','option');b.innerHTML='<img loading="lazy" alt=""><span class="search-result-copy"><span class="search-result-title"></span><span class="search-result-label">Play game</span></span>';const img=b.querySelector('img');img.src=game.image;img.alt=game.title;b.querySelector('.search-result-title').textContent=game.title;b.dataset.i=i;b.addEventListener('click',()=>{close();input.value=game.title;clear.style.display='block';game.card.click();renderRecommendations(game.title)});results.appendChild(b)});results.classList.add('is-open');input.setAttribute('aria-expanded','true')}
  function renderRecommendations(q){if(!recWrap||!recGrid)return;if(!q){recGrid.innerHTML='';recWrap.classList.remove('is-visible');return}const top5=new Set(matches(q).slice(0,5).map(g=>g.card));const qwords=norm(q).split(/\s+/).filter(Boolean);const pool=games().filter(g=>!top5.has(g.card));const picks=pool.map(g=>{const words=norm(g.title).split(/\s+/);const overlap=qwords.reduce((n,w)=>n+(words.some(x=>x.includes(w))?1:0),0);return {...g,overlap,r:Math.random()}}).sort((a,b)=>b.overlap-a.overlap||b.r-a.r).slice(0,6);recGrid.innerHTML='';picks.forEach(game=>{const b=document.createElement('button');b.type='button';b.className='search-recommendation';const img=document.createElement('img');img.loading='lazy';img.src=game.image;img.alt=game.title;const span=document.createElement('span');span.textContent=game.title;b.append(img,span);b.addEventListener('click',()=>game.card.click());recGrid.appendChild(b)});recWrap.classList.toggle('is-visible',picks.length>0)}
  input.addEventListener('input',()=>{const q=input.value.trim();clear.style.display=q?'block':'none';renderSuggestions(q);renderRecommendations(q)});input.addEventListener('focus',()=>{if(input.value.trim())renderSuggestions(input.value.trim())});input.addEventListener('keydown',e=>{const items=[...results.querySelectorAll('.search-result')];if(e.key==='ArrowDown'&&items.length){e.preventDefault();let i=items.findIndex(x=>x.classList.contains('is-active'));i=(i+1)%items.length;items.forEach((x,j)=>x.classList.toggle('is-active',j===i))}else if(e.key==='ArrowUp'&&items.length){e.preventDefault();let i=items.findIndex(x=>x.classList.contains('is-active'));i=i<=0?items.length-1:i-1;items.forEach((x,j)=>x.classList.toggle('is-active',j===i))}else if(e.key==='Enter'){const active=results.querySelector('.search-result.is-active');if(active){e.preventDefault();active.click()}}else if(e.key==='Escape')close()});clear.addEventListener('click',()=>{input.value='';clear.style.display='none';close();renderRecommendations('');input.focus()});document.addEventListener('click',e=>{if(!e.target.closest('.search-shell'))close()});
  window.openRandom=function(){const list=games();if(!list.length)return;list[Math.floor(Math.random()*list.length)].card.click()};
  let audio=null;function clickSound(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime,g=audio.createGain(),a=audio.createOscillator(),b=audio.createOscillator();a.type='sine';b.type='triangle';a.frequency.setValueAtTime(540,now);b.frequency.setValueAtTime(860,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.045,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+.075);a.connect(g);b.connect(g);g.connect(audio.destination);a.start(now);b.start(now);a.stop(now+.08);b.stop(now+.08)}catch(_){} }
  document.addEventListener('pointerdown',e=>{if(e.target.closest('button,.game-card'))clickSound()},{capture:true,passive:true});
  new MutationObserver(()=>{if(input.value.trim())renderSuggestions(input.value.trim())}).observe(grid,{childList:true,subtree:true});
})();
</script>'''
          if 'window.openRandom=function(){const list=games()' not in s:
              s=s.replace('</body>',js+'\n</body>',1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit page and clean temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish UI with live top-five search and recommendations' || true
          git rm -f .github/workflows/one-shot-ui.yml .github/workflows/final-ui-upgrade.yml 2>/dev/null || true
          git commit -m 'Remove temporary UI upgrade workflows' || true
          git push
