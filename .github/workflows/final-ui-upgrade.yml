name: Final UI upgrade

on:
  push:
    paths:
      - '.github/workflows/final-ui-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upgrade index UI and game discovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css = r'''

/* Final polished UI */
:root{
  --ubg-blue:#0062ff;
  --ubg-blue-dark:#004dcc;
  --ui-white:rgba(255,255,255,.98);
  --ui-ink:#152039;
  --ui-muted:#72809a;
  --ui-line:rgba(18,36,72,.10);
  --ui-shadow:0 14px 34px rgba(5,28,78,.16);
}
html{scroll-behavior:smooth}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background-color:#0c1730;background-attachment:fixed}
header.site-header{height:74px;box-sizing:border-box;padding:0 20px;background:var(--ubg-blue)!important;border:0;display:flex;align-items:center;position:relative;z-index:1000;box-shadow:0 3px 16px rgba(0,26,86,.18)}
.site-header .header-inner{width:100%;height:100%;display:flex;align-items:center;gap:12px;min-width:0}
.search-shell{position:relative;flex:0 1 330px;width:330px;max-width:330px;z-index:1002}
#searchBar{position:relative!important;left:auto!important;top:auto!important;display:block;width:100%;height:44px;box-sizing:border-box;padding:0 44px 0 43px;border:1px solid rgba(255,255,255,.78);border-radius:13px;outline:none;background:rgba(255,255,255,.98);color:var(--ui-ink);font:600 15px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 6px 18px rgba(0,33,102,.18),inset 0 1px 0 #fff;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
#searchBar::placeholder{color:#7a8497;font-weight:500}
#searchBar:focus{border-color:#fff;box-shadow:0 9px 24px rgba(0,26,88,.24),0 0 0 4px rgba(255,255,255,.17);transform:translateY(-1px)}
.search-icon{position:absolute;left:15px;top:50%;width:16px;height:16px;transform:translateY(-58%);border:2px solid #6c7890;border-radius:50%;pointer-events:none;z-index:2;box-sizing:border-box}
.search-icon:after{content:"";position:absolute;width:7px;height:2px;right:-5px;bottom:-2px;border-radius:2px;background:#6c7890;transform:rotate(45deg);transform-origin:left center}
.search-clear{position:absolute;right:7px;top:50%;width:30px;height:30px;transform:translateY(-50%);display:none;border:0;border-radius:8px;background:transparent;color:#69758a;font:700 19px/1 system-ui,sans-serif;cursor:pointer;z-index:3}
.search-clear:hover{background:#eef3fb;color:#18243c;transform:translateY(-50%) scale(1.04)}
.search-results{position:absolute;top:calc(100% + 8px);left:0;width:100%;padding:6px;box-sizing:border-box;border:1px solid var(--ui-line);border-radius:14px;background:var(--ui-white);box-shadow:0 18px 38px rgba(8,27,66,.24);display:none;overflow:hidden}
.search-results.is-open{display:block;animation:searchPanelIn .16s ease-out}
@keyframes searchPanelIn{from{opacity:0;transform:translateY(-5px) scale(.985)}to{opacity:1;transform:none}}
.search-result{width:100%;min-height:58px;padding:7px 8px;display:flex;align-items:center;gap:11px;border:0;border-radius:10px;background:transparent;color:var(--ui-ink);text-align:left;cursor:pointer;font:inherit}
.search-result:hover,.search-result.is-active{background:#f1f5fc;transform:scale(1.012)}
.search-result img{width:44px;height:44px;flex:0 0 44px;object-fit:cover;border-radius:9px;background:#e9eef7;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.search-result-copy{min-width:0}.search-result-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:750;line-height:1.25}.search-result-label{display:block;margin-top:3px;font-size:11px;font-weight:600;color:var(--ui-muted)}
.search-empty{padding:15px 11px;color:var(--ui-muted);font-size:13px;text-align:center}
.header-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;z-index:1001}
.header-action{width:148px;height:38px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;border:1px solid rgba(255,255,255,.42);border-radius:11px;background:#0a56d8;color:#fff;font:750 13px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.05px;cursor:pointer;white-space:nowrap;box-shadow:0 5px 14px rgba(0,30,100,.20),inset 0 1px 0 rgba(255,255,255,.20);transition:transform .16s ease,background .16s ease,box-shadow .16s ease}
.header-action:hover{transform:translateY(-2px) scale(1.025);background:#0950c7;box-shadow:0 9px 20px rgba(0,30,100,.28),inset 0 1px 0 rgba(255,255,255,.26)}
.header-action:active{transform:translateY(1px) scale(.98);box-shadow:0 3px 8px rgba(0,30,100,.20),inset 0 1px 2px rgba(0,0,0,.14)}
.action-icon{font-size:15px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.mc-text{margin-left:auto!important;position:relative!important;left:auto!important;top:auto!important;transform:rotate(-12deg)!important;white-space:nowrap;font-family:"Pixelify Sans",sans-serif;color:#fff!important;font-weight:800;font-size:16px;text-shadow:2px 2px 0 #000;animation:splash 1.25s infinite ease-in-out;background:linear-gradient(90deg,#fff,#8dd3ff,#fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:17px;padding:22px}
.game-card{position:relative;background:rgba(255,255,255,.98);border-radius:14px;overflow:hidden;text-align:center;cursor:pointer;box-shadow:0 5px 16px rgba(0,0,0,.12);transition:transform .20s cubic-bezier(.2,.8,.2,1),box-shadow .20s ease}
.game-card:hover{transform:translateY(-6px) scale(1.025)!important;box-shadow:0 15px 30px rgba(3,20,55,.24),0 0 0 1px rgba(255,255,255,.55)}
.game-card img{transition:transform .22s ease,filter .22s ease}
.game-card:hover img{transform:scale(1.04);filter:saturate(1.04)}
.game-card h3{font-size:15px;line-height:1.3;margin:10px 10px 12px;color:#172039}
.search-recommendations{display:none;padding:4px 22px 28px}
.search-recommendations.is-visible{display:block;animation:recommendIn .18s ease-out}
@keyframes recommendIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.search-recommendations-header{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:5px 0 12px;padding:0 2px}
.search-recommendations-title{margin:0;color:#fff;font:800 20px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-shadow:0 2px 5px rgba(0,0,0,.22)}
.search-recommendations-subtitle{margin:0;color:rgba(255,255,255,.72);font:600 12px/1.2 system-ui,sans-serif}
.search-recommendations-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:13px}
.search-recommendation{appearance:none;width:100%;padding:0;overflow:hidden;border:0;border-radius:13px;background:rgba(255,255,255,.98);text-align:left;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.12);transition:transform .18s ease,box-shadow .18s ease}
.search-recommendation:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 13px 24px rgba(0,0,0,.20)}
.search-recommendation img{display:block;width:100%;height:112px;object-fit:cover}
.search-recommendation span{display:block;padding:9px 10px 11px;color:#1b2740;font:750 13px/1.25 system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{background:var(--ubg-blue)!important}
@media(max-width:1050px){.search-shell{flex-basis:290px;width:290px;max-width:290px}.header-action{width:138px}.mc-text{font-size:14px}}
@media(max-width:830px){header.site-header{height:auto;min-height:76px;padding:11px 14px}.site-header .header-inner{height:auto;flex-wrap:wrap}.search-shell{order:1;flex:1 1 100%;width:100%;max-width:none}.header-actions{order:2;flex:0 1 auto}.header-action{width:146px}.mc-text{order:3;margin-left:auto!important;margin-right:4px!important}}
@media(max-width:570px){.header-actions{width:100%;display:grid;grid-template-columns:1fr 1fr}.header-action{width:100%;min-width:0}.mc-text{display:none}.search-recommendations{padding-left:14px;padding-right:14px}.search-recommendations-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.search-recommendation img{height:92px}}
'''
          if '/* Final polished UI */' not in html:
              html = html.replace('</style>', css + '\n</style>', 1)

          header = r'''<header class="site-header">
  <div class="header-inner">
    <div class="search-shell" role="search">
      <span class="search-icon" aria-hidden="true"></span>
      <input type="search" id="searchBar" placeholder="Search games..." autocomplete="off" spellcheck="false" aria-label="Search games" aria-controls="searchResults" aria-expanded="false">
      <button class="search-clear" id="searchClear" type="button" aria-label="Clear search">×</button>
      <div class="search-results" id="searchResults" role="listbox" aria-label="Game suggestions"></div>
    </div>
    <nav class="header-actions" aria-label="Game actions">
      <button onclick="openRandom()" class="header-action" data-dynamic-random-button type="button"><span class="action-icon" aria-hidden="true">🎲</span><span>Random Game</span></button>
      <button onclick="window.location.href='mailto:ubg423@gmail.com?subject=UBG%20Problem%20%2F%20Game%20Suggestion'" class="header-action" type="button"><span class="action-icon" aria-hidden="true">📝</span><span>Report / Suggest</span></button>
    </nav>
    <div class="mc-text">Lil croak was here!</div>
  </div>
</header>'''
          html = re.sub(r'<header\b[^>]*>.*?</header>', header, html, count=1, flags=re.S)

          recommendations = r'''
<section id="searchRecommendations" class="search-recommendations" aria-live="polite">
  <div class="search-recommendations-header">
    <h2 class="search-recommendations-title">You may also like</h2>
    <p class="search-recommendations-subtitle">More games to try</p>
  </div>
  <div class="search-recommendations-grid" id="searchRecommendationsGrid"></div>
</section>
'''
          if 'id="searchRecommendations"' not in html:
              html = html.replace('<footer>', recommendations + '\n<footer>', 1)

          js = r'''
<script>
(function(){
  const input=document.getElementById('searchBar');
  const results=document.getElementById('searchResults');
  const clear=document.getElementById('searchClear');
  const grid=document.getElementById('gameGrid');
  const recommendationWrap=document.getElementById('searchRecommendations');
  const recommendationGrid=document.getElementById('searchRecommendationsGrid');
  if(!input||!results||!clear||!grid)return;

  const normalize=s=>(s||'').toString().trim().toLowerCase();
  const readGames=()=>Array.from(grid.querySelectorAll(':scope > .game-card')).map((card,index)=>({
    card,
    index,
    title:(card.querySelector('h3')?.textContent||card.querySelector('img')?.alt||'Untitled game').trim(),
    image:card.querySelector('img')?.currentSrc||card.querySelector('img')?.src||''
  })).filter(game=>game.title);
  const score=(title,q)=>{
    const t=normalize(title), words=t.split(/\s+/), queryWords=normalize(q).split(/\s+/).filter(Boolean);
    if(t===normalize(q))return 0;
    if(t.startsWith(normalize(q)))return 1;
    if(words.some(word=>word.startsWith(normalize(q))))return 2;
    const overlap=queryWords.filter(qw=>words.some(w=>w.includes(qw))).length;
    if(overlap===queryWords.length&&overlap>0)return 2.5;
    if(t.includes(normalize(q)))return 3;
    return 99;
  };
  const matchedGames=q=>readGames().map(g=>({...g,score:score(g.title,q)})).filter(g=>g.score<99).sort((a,b)=>a.score-b.score||a.title.localeCompare(b.title));
  const closeResults=()=>{results.classList.remove('is-open');input.setAttribute('aria-expanded','false')};
  const openResults=()=>{results.classList.add('is-open');input.setAttribute('aria-expanded','true')};

  function renderSuggestions(q){
    const matches=matchedGames(q).slice(0,5);
    results.innerHTML='';
    if(!q){closeResults();return;}
    if(!matches.length){
      results.innerHTML='<div class="search-empty">No matching games yet</div>';
      openResults();return;
    }
    matches.forEach((game,i)=>{
      const button=document.createElement('button');
      button.type='button';button.className='search-result';button.setAttribute('role','option');
      button.innerHTML='<img loading="lazy" alt=""><span class="search-result-copy"><span class="search-result-title"></span><span class="search-result-label">Play game</span></span>';
      const img=button.querySelector('img');img.src=game.image;img.alt=game.title;
      button.querySelector('.search-result-title').textContent=game.title;
      button.dataset.index=String(i);
      button.addEventListener('click',()=>{closeResults();input.value=game.title;clear.style.display='block';game.card.click();renderRecommendations(game.title)});
      results.appendChild(button);
    });
    openResults();
  }

  function renderRecommendations(q){
    if(!recommendationWrap||!recommendationGrid)return;
    const normalizedQ=normalize(q);
    if(!normalizedQ){recommendationGrid.innerHTML='';recommendationWrap.classList.remove('is-visible');return;}
    const matches=matchedGames(q);
    const exactSet=new Set(matches.slice(0,5).map(g=>g.card));
    const all=readGames().filter(g=>!exactSet.has(g.card));
    const ranked=all.map(g=>({...g,sim:score(g.title,q)}).sort?null:null);
    const queryWords=normalizedQ.split(/\s+/).filter(Boolean);
    const scored=all.map(g=>{
      const words=normalize(g.title).split(/\s+/);
      const overlap=queryWords.reduce((n,qw)=>n+(words.some(w=>w.includes(qw))?1:0),0);
      return {...g,overlap,random:Math.random()};
    }).sort((a,b)=>b.overlap-a.overlap||b.random-a.random).slice(0,6);
    recommendationGrid.innerHTML='';
    scored.forEach(game=>{
      const button=document.createElement('button');button.type='button';button.className='search-recommendation';
      const img=document.createElement('img');img.src=game.image;img.alt=game.title;img.loading='lazy';
      const title=document.createElement('span');title.textContent=game.title;
      button.append(img,title);button.addEventListener('click',()=>game.card.click());recommendationGrid.appendChild(button);
    });
    recommendationWrap.classList.toggle('is-visible',scored.length>0);
  }

  input.addEventListener('input',()=>{
    const q=input.value.trim();clear.style.display=q?'block':'none';
    renderSuggestions(q);renderRecommendations(q);
  });
  input.addEventListener('focus',()=>{if(input.value.trim())renderSuggestions(input.value.trim())});
  input.addEventListener('keydown',e=>{
    const items=[...results.querySelectorAll('.search-result')];
    if(e.key==='ArrowDown'&&items.length){e.preventDefault();const next=(items.findIndex(x=>x.classList.contains('is-active'))+1)%items.length;items.forEach((x,i)=>x.classList.toggle('is-active',i===next))}
    else if(e.key==='ArrowUp'&&items.length){e.preventDefault();const current=items.findIndex(x=>x.classList.contains('is-active'));const next=(current<=0?items.length:current)-1;items.forEach((x,i)=>x.classList.toggle('is-active',i===next))}
    else if(e.key==='Enter'){const active=results.querySelector('.search-result.is-active');if(active){e.preventDefault();active.click()}}
    else if(e.key==='Escape'){closeResults()}
  });
  clear.addEventListener('click',()=>{input.value='';clear.style.display='none';closeResults();renderRecommendations('');input.focus()});
  document.addEventListener('click',e=>{if(!e.target.closest('.search-shell'))closeResults()});

  window.openRandom=function(){
    const games=readGames();
    if(!games.length)return;
    const pick=games[Math.floor(Math.random()*games.length)];
    pick.card.click();
  };

  let audioContext=null;
  function clickSound(){
    try{
      audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();
      if(audioContext.state==='suspended')audioContext.resume();
      const now=audioContext.currentTime;
      const gain=audioContext.createGain();
      const osc1=audioContext.createOscillator();
      const osc2=audioContext.createOscillator();
      osc1.type='sine';osc2.type='triangle';osc1.frequency.setValueAtTime(560,now);osc2.frequency.setValueAtTime(920,now);
      gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(0.045,now+0.008);gain.gain.exponentialRampToValueAtTime(0.0001,now+0.075);
      osc1.connect(gain);osc2.connect(gain);gain.connect(audioContext.destination);osc1.start(now);osc2.start(now);osc1.stop(now+0.08);osc2.stop(now+0.08);
    }catch(_){ }
  }
  document.addEventListener('pointerdown',e=>{if(e.target.closest('button,.game-card'))clickSound()},{capture:true,passive:true});
  new MutationObserver(()=>{if(input.value.trim())renderSuggestions(input.value.trim())}).observe(grid,{childList:true,subtree:true});
})();
</script>
'''
          if '/* Final polished UI */' not in html or 'window.openRandom=function()' not in html:
              html = html.replace('</body>', js + '\n</body>', 1)

          path.write_text(html,encoding='utf-8')
          print('Final UI upgrade applied')
          PY

      - name: Commit finished page
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes to commit'
          else
            git commit -m 'Polish UI, live search, recommendations and controls'
            git push
          fi

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/final-ui-upgrade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/final-ui-upgrade.yml
          if git diff --cached --quiet; then
            echo 'Workflow already absent'
          else
            git commit -m 'Remove temporary UI upgrade workflow'
            git push
          fi
