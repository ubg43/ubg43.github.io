name: Homepage UI polish

on:
  push:
    paths:
      - '.github/ui_polish.py'
      - '.github/ui-polish-trigger'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI polish
        run: python3 .github/ui_polish.py
      - name: Commit homepage polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish homepage interactions and click feedback' || exit 0
          git push
