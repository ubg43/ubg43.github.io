name: Homepage QA polish
on:
  push:
    paths:
      - '.github/qa-polish.py'
      - '.github/qa-polish-trigger'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply homepage reliability fixes
        run: python3 .github/qa-polish.py
      - name: Commit homepage fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Polish homepage usability and recommendations'
          git push
