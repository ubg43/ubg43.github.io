name: Verify Supabase trending
on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/run-supabase-activation.yml'
      - '.github/activate-supabase-trending.py'
      - '.github/stable-runtime-hotfix.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Supabase and homepage runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          idx=Path('index.html').read_text(encoding='utf-8')
          required=[
              'wewynhmybroxzynaxnrx.supabase.co',
              'SUPABASE_TRENDING_URL',
              'function loadGlobalTrending',
              'window.openGame=openGame',
              'id="gameGrid"',
              'id="searchBar"',
              'const rawSearch=',
              'const searchMatches=',
              'let cardCache=null;',
              'let searchTimer=null;',
              'content-visibility:auto',
          ]
          bad=[x for x in required if x not in idx]
          if idx.count('id="ubg43-final-runtime"') != 1:
              bad.append('canonical runtime marker count is not 1')
          for old in ('api.counterapi.dev','ubg43-global-trending-v1','global-trending.json'):
              if old in idx:
                  bad.append('old trending backend remains: '+old)
          scripts=re.findall(r'<script([^>]*)>(.*?)</script>',idx,re.I|re.S)
          with tempfile.TemporaryDirectory() as td:
              for i,(attrs,body) in enumerate(scripts):
                  if 'application/ld+json' in attrs.lower() or not body.strip():
                      continue
                  f=Path(td)/f'script{i}.js'
                  f.write_text(body,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode:
                      bad.append('JavaScript syntax error: '+(r.stderr.strip().splitlines()[-1] if r.stderr.strip() else 'unknown'))
          if bad:
              raise SystemExit('SUPABASE/HOMEPAGE VALIDATION FAILED:\n'+'\n'.join(bad))
          print('SUPABASE/HOMEPAGE VALIDATION PASSED')
          PY
