name: Darken homepage UI

on:
  push:
    paths:
      - '.github/ui-trigger'

permissions:
  contents: write

jobs:
  darken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Darken blue UI colors only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            '--blue:#0062ff;':'--blue:#004dcc;',
            '--blue-deep:#0051d6;':'--blue-deep:#003ea8;',
            'background:#0b57d9;':'background:#0849b6;',
            'background:#0950c7;':'background:#063f9f;',
            'background:rgba(0,73,190,.72);':'background:rgba(0,58,160,.80);',
            'background:rgba(0,83,213,.9);':'background:rgba(0,68,182,.93);',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected UI color: {old}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit UI color update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Darken homepage blue UI' || exit 0
          git push
