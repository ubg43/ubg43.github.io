name: Inspect TopGames Sources

on:
  push:
    branches:
      - debug/topgames-embed-sources
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch TopGames pages and inspect redirects
        shell: bash
        run: |
          set -euxo pipefail
          for pair in             "rivals|https://topgames.gg/embed/rivals?pub_id=&preroll=0"             "steal|https://topgames.gg/embed/steal-an-egg?pub_id=&preroll=0"             "obby|https://topgames.gg/embed/obby-steal-an-egg?pub_id=&preroll=0"             "meccha|https://topgames.gg/embed/meccha-chameleon-online?pub_id=&preroll=0"
          do
            name="${pair%%|*}"
            url="${pair#*|}"
            echo "===== $name ====="
            echo "URL: $url"
            curl -L --max-time 30 --compressed -sS -D "/tmp/${name}.headers" -o "/tmp/${name}.html" "$url" || true
            echo "--- final headers ---"
            sed -n '1,80p' "/tmp/${name}.headers" || true
            echo "--- page size ---"
            wc -c "/tmp/${name}.html" || true
            echo "--- url-like references ---"
            grep -Eoi 'https?://[^"'"'"' <>()]+' "/tmp/${name}.html" | sort -u | head -100 || true
            echo "--- iframe/src/href snippets ---"
            grep -Eoi '.{0,180}(iframe|src=|location|window\.open|yandex).{0,260}' "/tmp/${name}.html" | head -80 || true
            echo "--- first 12k ---"
            head -c 12000 "/tmp/${name}.html" || true
            echo
          done


      - name: Inspect direct providers
        shell: bash
        run: |
          set -euxo pipefail
          for pair in             "rivals_provider|https://veck.io/"             "steal_yandex|https://yandex.com/games/app/580426?utm_source=distrib&is-united-page=1&skip-guard=1&header=no&utm_medium=topgames.gg&clid=10575041&flags=%7B%22adv_sticky_banner_disabled%22%3Atrue%7D"             "meccha_yandex|https://yandex.com/games/app/593207?utm_source=distrib&is-united-page=1&skip-guard=1&header=no&utm_medium=topgames.gg&clid=10575041&flags=%7B%22adv_sticky_banner_disabled%22%3Atrue%7D"
          do
            name="${pair%%|*}"
            url="${pair#*|}"
            echo "===== DIRECT $name ====="
            curl -L --max-time 30 --compressed -sS -D "/tmp/${name}.headers" -o "/tmp/${name}.html" "$url" || true
            echo "--- headers ---"
            sed -n '1,80p' "/tmp/${name}.headers" || true
            echo "--- size ---"
            wc -c "/tmp/${name}.html" || true
            echo "--- refs ---"
            grep -Eoi 'https?://[^"'"'"' <>()]+' "/tmp/${name}.html" | sort -u | head -150 || true
            echo "--- iframe/script references ---"
            grep -Eoi '.{0,200}(iframe|script|src=|game|webpack|main\.js|yandex).{0,350}' "/tmp/${name}.html" | head -120 || true
          done
