name: Fix and validate live site
on:
  push:
    paths:
      - '.github/fix-live-site.py'
      - '.github/workflows/fix-live-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[live-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply live fixes
        run: python3 .github/fix-live-site.py
      - name: Validate HTML structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          p=Path('index.html'); text=p.read_text(encoding='utf-8')
          cards=re.findall(r'<div\s+class="game-card"(?=\s|>)',text,re.I)
          required=['id="gameGrid"','id="searchBar"','id="categoryToggle"','id="randomGameButton"','id="reportGameButton"','function openGame(']
          missing=[x for x in required if x not in text]
          bad=[]
          if len(cards)<1000: bad.append(f'only {len(cards)} game cards in index.html')
          if 'id="loadingCard"' in text or 'Loading games...' in text: bad.append('obsolete loading placeholder remains')
          if 'id="ubg43-live-ribbon-runtime"' not in text: bad.append('live ribbon runtime missing')
          if missing: bad.append('missing '+', '.join(missing))
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print(f'SMOKE CHECK PASSED: {len(cards)} cards')
          PY
      - name: Commit repaired site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html legacy-index.html
          git commit -m 'Fix live homepage UI and remove loader [live-fix]' || exit 0
          git push
