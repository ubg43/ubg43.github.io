name: Fix and validate live site
on:
  push:
    paths:
      - '.github/repair-ui.py'
      - '.github/stable-runtime-hotfix.py'
      - '.github/workflows/fix-live-site.yml'
      - 'legacy-index.html'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ubg43-maintenance
  cancel-in-progress: false
jobs:
  repair:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[live-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Write stable UBG43 homepage
        run: python3 .github/repair-ui.py
      - name: Harden stable runtime
        run: python3 .github/stable-runtime-hotfix.py
      - name: Validate homepage structure and browser scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys,tempfile,subprocess
          idx=Path('index.html').read_text(encoding='utf-8')
          bad=[]
          required=['id="gameGrid"','id="searchBar"','id="categoryToggle"','id="randomGameButton"','id="reportGameButton"','window.openGame','Play games instantly with UBG43!','1000+ games','Trending Now','New Games','You may also like','https://forms.gle/zXYtnxwXhGvXmBrq9','legacy-index.html','zones.json','rel="canonical"','application/ld+json']
          for needle in required:
              if needle not in idx: bad.append(needle)
          forbidden=['Building your game library…','Building your game library...','id="loadingCard"','new MutationObserver','window.open(\'about:blank\'','<iframe src=','ubg43-site-protection-runtime','ubg43-hotfix-runtime','ubg43-direct-launch-runtime','ubg43-final-interactions-runtime']
          for needle in forbidden:
              if needle in idx: bad.append('forbidden runtime remains: '+needle)
          if idx.count('id="gameGrid"')!=1: bad.append('gameGrid must exist exactly once')
          if idx.count('<script type="application/ld+json">')!=1: bad.append('JSON-LD script count is wrong')
          if not Path('robots.txt').exists(): bad.append('robots.txt missing')
          if not Path('sitemap.xml').exists(): bad.append('sitemap.xml missing')
          scripts=re.findall(r'<script([^>]*)>(.*?)</script>',idx,re.I|re.S)
          with tempfile.TemporaryDirectory() as td:
              for i,(attrs,s) in enumerate(scripts):
                  if 'application/ld+json' in attrs.lower() or not s.strip(): continue
                  p=Path(td)/f'script{i}.js';p.write_text(s,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                  if r.returncode: bad.append('JavaScript syntax error: '+r.stderr.strip().splitlines()[-1])
          if bad:
              print('LIVE SITE VALIDATION FAILED')
              print('\n'.join(bad))
              sys.exit(1)
          print('LIVE SITE VALIDATION PASSED: stable homepage, single runtime, library loading, lazy images, search, categories, random, report, carousels, recommendations, automatic sources, and JavaScript syntax.')
          PY
      - name: Commit repaired site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply stable UBG43 homepage [live-fix]'
          git push
