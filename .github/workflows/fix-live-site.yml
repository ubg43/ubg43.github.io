name: Fix and validate live site
on:
  push:
    paths:
      - '.github/fix-live-site.py'
      - '.github/workflows/fix-live-site.yml'
      - '.github/repair-ui.py'
      - '.github/ui-hotfix.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ubg43-maintenance
  cancel-in-progress: false
jobs:
  repair:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[live-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply final UBG43 UI runtime
        run: python3 .github/repair-ui.py
      - name: Apply UBG43 compatibility and interaction hotfixes
        run: python3 .github/ui-hotfix.py
      - name: Apply live loader cleanup and automation resilience
        run: python3 .github/fix-live-site.py
      - name: Validate homepage structure and runtime hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          text=Path('index.html').read_text(encoding='utf-8')
          bad=[]
          for needle in ['id="gameGrid"','id="searchBar"','id="categoryToggle"','id="randomGameButton"','id="reportGameButton"','window.openGame','You may also like','Play games instantly with UBG43!','1000+ games','v3-carousel','v3-ribbon']:
              if needle not in text: bad.append(needle)
          if 'id="loadingCard"' in text or 'Loading games...' in text: bad.append('obsolete loading placeholder')
          if bad:
              print('LIVE SITE VALIDATION FAILED');print('\n'.join(bad));sys.exit(1)
          print('LIVE SITE VALIDATION PASSED: UBG43 V3 runtime, hotfixes and metadata are present.')
          PY
      - name: Commit repaired site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html legacy-index.html .github/auto-categories.py || true
          git add index.html legacy-index.html .github/auto-categories.py 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Apply UBG43 V3 homepage and interactions [live-fix]'
          git push
