name: Fix and validate live site
on:
  push:
    paths:
      - '.github/fix-live-site.py'
      - '.github/workflows/fix-live-site.yml'
      - '.github/repair-ui.py'
      - '.github/ui-hotfix.py'
      - '.github/dedupe-games.py'
      - '.github/game-launch-fix.py'
      - '.github/final-layout-fix.py'
      - '.github/final-interactions.py'
      - '.github/seo-enhancer.py'
      - '.github/site-protection.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ubg43-maintenance
  cancel-in-progress: false
jobs:
  repair:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[live-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Apply final UBG43 UI runtime
        run: python3 .github/repair-ui.py
      - name: Apply UBG43 compatibility and interaction hotfixes
        run: python3 .github/ui-hotfix.py
      - name: Deduplicate legacy game library
        run: python3 .github/dedupe-games.py
      - name: Repair all game launch paths
        run: python3 .github/game-launch-fix.py
      - name: Apply live loader cleanup, automation resilience and four-day rotation
        run: python3 .github/fix-live-site.py
      - name: Apply final homepage hero cleanup
        run: python3 .github/final-layout-fix.py
      - name: Apply final search and report interactions
        run: python3 .github/final-interactions.py
      - name: Apply UBG43 SEO enhancements
        run: python3 .github/seo-enhancer.py
      - name: Apply non-breaking UBG43 site protection
        run: python3 .github/site-protection.py
      - name: Validate homepage structure and runtime hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          idx=Path('index.html').read_text(encoding='utf-8')
          leg=Path('legacy-index.html').read_text(encoding='utf-8')
          bad=[]
          for needle in ['id="gameGrid"','id="searchBar"','id="categoryToggle"','id="randomGameButton"','id="reportGameButton"','window.openGame','You may also like','Play games instantly with UBG43!','1000+ games','v3-carousel','v3-ribbon','ubg43-search-active','Search results','https://forms.gle/zXYtnxwXhGvXmBrq9','rel="canonical"','https://ubg43.github.io/','application/ld+json','ubg43-site-protection','UBG43 — original site content','Source: UBG43 — https://ubg43.github.io/']:
              if needle not in idx:bad.append(needle)
          if 'id="loadingCard"' in idx or 'Loading games...' in idx:bad.append('obsolete loading placeholder')
          if "window.open('about:blank'" in idx or '<iframe src=' in idx:bad.append('iframe/about:blank game launcher still present')
          if 'function play(g){' in idx and 'window.open(url' not in idx:bad.append('direct play implementation missing')
          if re.search(r'<section\s+class=["\']hero["\']',idx,re.I):bad.append('legacy duplicate hero remains')
          if idx.count('id="v3Hero"')>1:bad.append('duplicate V3 hero remains')
          titles=re.findall(r'<h3[^>]*>(.*?)</h3>',leg,re.I|re.S)
          clean=lambda s:re.sub(r'\s+',' ',re.sub(r'<[^>]+>','',s)).strip().casefold()
          t=[clean(x) for x in titles if clean(x)]
          dups=sorted({x for x in t if t.count(x)>1})
          if dups:bad.append('legacy duplicate titles: '+', '.join(dups[:8]))
          if 'zones.json' not in idx:bad.append('GN-Math automatic catalogue missing')
          if 'legacy-index.html' not in idx:bad.append('legacy library source missing')
          if '1000+ games • fast search • automatic categories • new-game ribbons • trending picks • rotating homepage' not in idx:bad.append('final homepage stat missing')
          if not Path('robots.txt').exists():bad.append('robots.txt missing')
          if not Path('sitemap.xml').exists():bad.append('sitemap.xml missing')
          if bad:
              print('LIVE SITE VALIDATION FAILED');print('\n'.join(bad));sys.exit(1)
          # Lightweight JavaScript syntax validation for the generated runtime blocks.
          import subprocess,tempfile
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',idx,re.I|re.S)
          with tempfile.TemporaryDirectory() as td:
              for i,s in enumerate(scripts):
                  if s.strip():
                      p=Path(td)/f'script{i}.js';p.write_text(s,encoding='utf-8')
                      r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                      if r.returncode!=0:
                          bad.append('JavaScript syntax error in '+p.name+': '+r.stderr.strip().splitlines()[-1])
          if bad:
              print('LIVE SITE VALIDATION FAILED');print('\n'.join(bad));sys.exit(1)
          print(f'LIVE SITE VALIDATION PASSED: {len(t)} unique legacy titles + runtime GN-Math catalogue + direct launch path + search mode + report form + SEO metadata + site protection + JavaScript syntax checks + single hero.')
          PY
      - name: Commit repaired site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html legacy-index.html .github/auto-categories.py .github/final-layout-fix.py .github/final-interactions.py .github/seo-enhancer.py .github/site-protection.py robots.txt sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m 'Apply UBG43 V3 homepage and interactions [live-fix]'
          git push
