name: Restore personalized recommendations
on:
  push:
    paths:
      - '.github/recommendation-restore.py'
      - '.github/recommendation-restore-trigger'
permissions:
  contents: write
jobs:
  recommendations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply recommendation system
        run: python3 .github/recommendation-restore.py
      - name: Commit homepage update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore accurate personalized recommendations' || exit 0
          git push
