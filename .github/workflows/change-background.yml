name: Change homepage background

on:
  push:
    paths:
      - '.github/background-trigger'

permissions:
  contents: write

jobs:
  background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update background
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='background:#0b1731 url("galaxy.jpg") center top/cover fixed no-repeat;'
          new='background:\n        radial-gradient(circle at 18% 18%, rgba(67, 131, 255, .22), transparent 28%),\n        radial-gradient(circle at 82% 24%, rgba(139, 92, 246, .18), transparent 26%),\n        radial-gradient(circle at 50% 88%, rgba(20, 184, 166, .13), transparent 30%),\n        linear-gradient(135deg, #07142f 0%, #0b2250 45%, #111936 100%);'
          if old not in s:
              raise SystemExit('background declaration not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit background update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh homepage background' || exit 0
          git push
