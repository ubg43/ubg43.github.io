name: Change homepage background

on:
  push:
    paths:
      - '.github/background-trigger'
      - '.github/workflows/change-background.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update background safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new='background: radial-gradient(circle at 18% 18%, rgba(67, 131, 255, .22), transparent 28%), radial-gradient(circle at 82% 24%, rgba(139, 92, 246, .18), transparent 26%), radial-gradient(circle at 50% 88%, rgba(20, 184, 166, .13), transparent 30%), linear-gradient(135deg, #07142f 0%, #0b2250 45%, #111936 100%);'
          m=re.search(r'(body\{[^}]*?)(background:[^;]+;)',s,re.S|re.I)
          if not m:
              raise SystemExit('body background declaration not found')
          s=s[:m.start(2)] + new + s[m.end(2):]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Harden stable runtime and restore interaction badges
        run: python3 .github/stable-runtime-hotfix.py
      - name: Apply final link and runtime sanity fixes
        run: python3 .github/site-finalizer.py
      - name: Commit background update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh homepage background [background-fix]' || exit 0
          git push
