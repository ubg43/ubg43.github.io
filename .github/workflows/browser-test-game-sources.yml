name: Browser test game sources

on:
  push:
    branches:
      - debug/topgames-embed-sources
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium test harness
        shell: bash
        run: |
          set -euxo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Test direct game iframes
        shell: bash
        run: |
          node browser-test-game-sources.mjs
