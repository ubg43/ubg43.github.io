name: Fix personalized recommendations

on:
  push:
    paths:
      - '.github/recommendations-fix-trigger'
      - '.github/recommendations_fix.py'
permissions:
  contents: write
jobs:
  recommendations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply recommendations fix
        run: python3 .github/recommendations_fix.py
      - name: Commit homepage update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix personalized recommendations carousel' || exit 0
          git push
