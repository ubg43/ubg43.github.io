name: UBG search upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, 'Upgrade live game search') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade index.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          css = '''
    /* Premium live search */
    .search-shell { position:absolute; top:50%; left:20px; transform:translateY(-50%); width:min(330px,calc(100vw - 40px)); z-index:50; }
    #searchBar { box-sizing:border-box; width:100%; height:48px; padding:0 48px 0 45px; border:1px solid rgba(255,255,255,.7); border-radius:14px; outline:none; background:rgba(255,255,255,.98); color:#172033; font:500 17px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; box-shadow:0 7px 22px rgba(0,38,120,.22),inset 0 1px 0 rgba(255,255,255,.9); transition:box-shadow .18s ease,transform .18s ease,border-color .18s ease; }
    #searchBar::placeholder { color:#7a8497; }
    #searchBar:focus { border-color:rgba(255,255,255,.95); box-shadow:0 10px 28px rgba(0,35,110,.28),0 0 0 4px rgba(255,255,255,.16); transform:translateY(-1px); }
    .search-icon { position:absolute; left:16px; top:50%; width:17px; height:17px; transform:translateY(-55%); border:2px solid #69758b; border-radius:50%; pointer-events:none; box-sizing:border-box; }
    .search-icon::after { content:""; position:absolute; width:7px; height:2px; right:-5px; bottom:-2px; border-radius:2px; background:#69758b; transform:rotate(45deg); transform-origin:left center; }
    .search-clear { position:absolute; right:10px; top:50%; width:30px; height:30px; transform:translateY(-50%); border:0; border-radius:9px; background:transparent; color:#6f7b90; font:600 19px/1 system-ui,sans-serif; cursor:pointer; display:none; padding:0; }
    .search-clear:hover { background:#edf2fb; color:#172033; }
    .search-results { position:absolute; top:calc(100% + 9px); left:0; width:100%; box-sizing:border-box; padding:7px; border:1px solid rgba(20,38,75,.08); border-radius:15px; background:rgba(255,255,255,.98); box-shadow:0 18px 45px rgba(13,32,76,.22),0 3px 10px rgba(13,32,76,.10); backdrop-filter:blur(14px); display:none; overflow:hidden; }
    .search-results.is-open { display:block; animation:searchDrop .16s ease-out; }
    @keyframes searchDrop { from { opacity:0; transform:translateY(-5px) scale(.985); } to { opacity:1; transform:translateY(0) scale(1); } }
    .search-result { width:100%; display:flex; align-items:center; gap:11px; min-height:54px; padding:7px 9px; box-sizing:border-box; border:0; border-radius:11px; background:transparent; color:#172033; text-align:left; cursor:pointer; font:inherit; }
    .search-result:hover,.search-result.is-active { background:#f0f5ff; }
    .search-result img { width:43px; height:43px; flex:0 0 43px; object-fit:cover; border-radius:9px; background:#e9eef7; box-shadow:0 2px 7px rgba(0,0,0,.12); }
    .search-result-copy { min-width:0; }
    .search-result-title { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:700; line-height:1.25; }
    .search-result-label { display:block; margin-top:2px; color:#8290a7; font-size:11px; font-weight:500; }
    .search-empty { padding:15px 12px; color:#7b879b; font-size:13px; text-align:center; }
    @media (max-width:720px) { header { min-height:76px; height:auto; box-sizing:border-box; padding:14px; } .search-shell { position:relative; top:auto; left:auto; transform:none; width:100%; } }
'''

          if '/* Premium live search */' not in html:
              html = html.replace('</style>', css + '\n  </style>', 1)

          old = '<input type="text" id="searchBar" placeholder="Search Games..." />'
          new = '''<div class="search-shell" role="search">
    <span class="search-icon" aria-hidden="true"></span>
    <input type="search" id="searchBar" placeholder="Search games..." autocomplete="off" spellcheck="false" aria-label="Search games" aria-controls="searchResults" aria-expanded="false">
    <button class="search-clear" id="searchClear" type="button" aria-label="Clear search">×</button>
    <div class="search-results" id="searchResults" role="listbox" aria-label="Game suggestions"></div>
  </div>'''
          if old in html:
              html = html.replace(old, new, 1)

          js = '''
<script>
(function(){
  const input=document.getElementById('searchBar'), results=document.getElementById('searchResults'), clear=document.getElementById('searchClear'), grid=document.getElementById('gameGrid');
  if(!input||!results||!clear||!grid)return;
  let active=-1;
  const games=()=>Array.from(grid.querySelectorAll(':scope > .game-card')).map(card=>({card,title:(card.querySelector('h3')?.textContent||card.querySelector('img')?.alt||'Untitled game').trim(),image:card.querySelector('img')?.currentSrc||card.querySelector('img')?.src||''})).filter(g=>g.title);
  const score=(title,q)=>{title=title.toLowerCase();q=q.toLowerCase();if(title===q)return 0;if(title.startsWith(q))return 1;if(title.split(/\s+/).some(w=>w.startsWith(q)))return 2;if(title.includes(q))return 3;return 99;};
  function close(){results.classList.remove('is-open');input.setAttribute('aria-expanded','false');active=-1;}
  function render(value){const q=value.trim();clear.style.display=q?'block':'none';results.innerHTML='';active=-1;if(!q){close();return;}const matches=games().map(g=>({...g,s:score(g.title,q)})).filter(g=>g.s<99).sort((a,b)=>a.s-b.s||a.title.localeCompare(b.title)).slice(0,3);if(!matches.length){results.innerHTML='<div class="search-empty">No games found</div>';results.classList.add('is-open');input.setAttribute('aria-expanded','true');return;}matches.forEach((g,i)=>{const b=document.createElement('button');b.type='button';b.className='search-result';b.setAttribute('role','option');b.innerHTML='<img loading="lazy" alt=""><span class="search-result-copy"><span class="search-result-title"></span><span class="search-result-label">Play game</span></span>';const img=b.querySelector('img');img.src=g.image;img.alt=g.title;b.querySelector('.search-result-title').textContent=g.title;b.addEventListener('click',()=>{close();input.value=g.title;clear.style.display='block';g.card.click();});results.appendChild(b);});results.classList.add('is-open');input.setAttribute('aria-expanded','true');}
  input.addEventListener('input',()=>render(input.value));
  input.addEventListener('focus',()=>{if(input.value.trim())render(input.value);});
  input.addEventListener('keydown',e=>{const items=Array.from(results.querySelectorAll('.search-result'));if(e.key==='ArrowDown'&&items.length){e.preventDefault();active=(active+1)%items.length;}else if(e.key==='ArrowUp'&&items.length){e.preventDefault();active=(active-1+items.length)%items.length;}else if(e.key==='Enter'&&active>=0&&items[active]){e.preventDefault();items[active].click();}else if(e.key==='Escape')close();items.forEach((item,i)=>item.classList.toggle('is-active',i===active));});
  clear.addEventListener('click',()=>{input.value='';input.focus();close();clear.style.display='none';});
  document.addEventListener('click',e=>{if(!e.target.closest('.search-shell'))close();});
  new MutationObserver(()=>{if(input.value.trim()&&document.activeElement===input)render(input.value);}).observe(grid,{childList:true,subtree:true});
})();
</script>
'''
          if 'Premium live search' in html and 'new MutationObserver(()=>{if(input.value.trim()' not in html:
              html = html.replace('</body>', js + '\n</body>', 1)
          p.write_text(html,encoding='utf-8')
      - name: Commit result and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/ubg-search-upgrade.yml
          git commit -m "Upgrade live game search"
          git push
