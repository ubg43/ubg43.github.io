name: Add personalized recommendations carousel

on:
  push:
    paths:
      - '.github/recommendations-trigger'

permissions:
  contents: write

jobs:
  personalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade recommendations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '  loadLegacyGames();'
          if '/* Personalized recommendation carousel */' in s:
              print('Personalized recommendations already installed')
              raise SystemExit(0)
          if marker not in s:
              raise SystemExit('Could not find loadLegacyGames marker')

          block = r'''

  /* Personalized recommendation carousel */
  (function(){
    const recSection=document.getElementById('searchRecommendations');
    const recGrid=document.getElementById('searchRecommendationsGrid');
    const gameGridEl=document.getElementById('gameGrid');
    const searchInput=document.getElementById('searchBar');
    if(!recSection||!recGrid||!gameGridEl||!searchInput)return;

    const HISTORY_KEY='ubg_play_history_v2';
    const HISTORY_LIMIT=80;
    const normalizeText=s=>(s||'').toString().toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
    const stopWords=new Set(['the','and','for','with','game','games','play','new','online','3d','io','html','html5']);
    const tokens=s=>normalizeText(s).split(' ').filter(w=>w.length>1&&!stopWords.has(w));
    const gameKey=g=>normalizeText(g.title)+'|'+g.image;

    function readHistory(){
      try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'{}')||{};}catch(_){return {};}
    }
    function writeHistory(history){
      try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history));}catch(_){}
    }
    function recordGame(game){
      if(!game||!game.title)return;
      const history=readHistory();
      const key=gameKey(game);
      const item=history[key]||{title:game.title,image:game.image,plays:0,lastPlayed:0,tokens:tokens(game.title)};
      item.title=game.title;item.image=game.image;item.tokens=tokens(game.title);item.plays+=1;item.lastPlayed=Date.now();
      history[key]=item;
      const keys=Object.keys(history).sort((a,b)=>(history[b].lastPlayed||0)-(history[a].lastPlayed||0)).slice(0,HISTORY_LIMIT);
      const trimmed={};keys.forEach(k=>trimmed[k]=history[k]);
      writeHistory(trimmed);
    }

    function scrape(){
      return Array.from(gameGridEl.querySelectorAll(':scope > .game-card')).map((card,index)=>({
        card,index,
        title:(card.querySelector('h3')?.textContent||card.querySelector('img')?.alt||'Game').trim(),
        image:card.querySelector('img')?.currentSrc||card.querySelector('img')?.src||'',
        key:gameKey({title:(card.querySelector('h3')?.textContent||card.querySelector('img')?.alt||'Game').trim(),image:card.querySelector('img')?.currentSrc||card.querySelector('img')?.src||''})
      })).filter(g=>g.title);
    }

    function overlap(a,b){
      const A=new Set(tokens(a)), B=new Set(tokens(b));
      if(!A.size||!B.size)return 0;
      let hit=0;A.forEach(x=>{if(B.has(x))hit++;});
      return hit/Math.sqrt(A.size*B.size);
    }
    function daysSince(ts){return ts?Math.max(0,(Date.now()-ts)/86400000):999;}

    function scoreCandidate(game,query,history,maxPlays){
      const played=Object.values(history);
      const totalPlayed=played.reduce((n,x)=>n+(x.plays||0),0);
      const qSim=query?overlap(game.title,query):0;
      const tokenWeights={};
      let maxAffinity=0;
      played.forEach(item=>{
        const weight=Math.sqrt(item.plays||0);
        item.tokens.forEach(t=>tokenWeights[t]=(tokenWeights[t]||0)+weight);
      });
      let rawAffinity=0;
      tokens(game.title).forEach(t=>rawAffinity+=tokenWeights[t]||0);
      if(totalPlayed>0)maxAffinity=Math.max(1,...Object.keys(tokenWeights).map(k=>tokenWeights[k]));
      const taste=maxAffinity?Math.min(1,rawAffinity/(maxAffinity*Math.max(1,tokens(game.title).length))):0;
      let rawRecent=0;
      played.forEach(item=>{
        const sim=overlap(game.title,item.title);
        if(sim>0)rawRecent+=sim*(item.plays||0)*Math.exp(-daysSince(item.lastPlayed)/14);
      });
      const recentNorm=Math.min(1,rawRecent/Math.max(1,totalPlayed));
      const popularity=maxPlays?Math.log1p((readHistory()[game.key]?.plays||0))/Math.log1p(maxPlays):0;
      const exploration=1/Math.sqrt(1+(readHistory()[game.key]?.plays||0));

      if(!played.length){
        return qSim*.60+exploration*.25+popularity*.15;
      }
      return taste*.38+qSim*.25+recentNorm*.22+popularity*.10+exploration*.05;
    }

    let recOffset=0;
    let recItems=[];
    function buildShell(){
      const header=recSection.querySelector('.search-recommendations-header');
      if(!header)return;
      if(!document.getElementById('recommendationNext')){
        const next=document.createElement('button');
        next.type='button';next.id='recommendationNext';next.className='recommendation-arrow';next.setAttribute('aria-label','Show more recommendations');next.innerHTML='<span aria-hidden="true">→</span>';
        header.appendChild(next);
        next.addEventListener('click',()=>{
          recOffset=Math.min(Math.max(0,recItems.length-4),recOffset+4);
          paintTrack();
        });
      }
      recGrid.classList.add('recommendation-track');
    }

    function paintTrack(){
      const cards=[...recGrid.children];
      const start=recOffset;
      cards.forEach((card,i)=>card.classList.toggle('is-shifted',i<start));
      recGrid.style.setProperty('--recommend-offset',String(start));
      const next=document.getElementById('recommendationNext');
      if(next)next.disabled=start>=Math.max(0,recItems.length-4);
      if(next)next.classList.toggle('is-hidden',recItems.length<=4);
    }

    function renderPersonalized(query){
      const games=scrape();
      if(!query||games.length<1){
        recSection.classList.remove('is-visible');
        recGrid.innerHTML='';recItems=[];recOffset=0;
        return;
      }
      buildShell();
      const history=readHistory();
      const playedKeys=new Set(Object.keys(history));
      const matchingTop=new Set((typeof matched==='function'?matched(query):[]).slice(0,5).map(x=>gameKey(x)));
      const maxPlays=Math.max(1,...Object.values(history).map(x=>x.plays||0));
      recItems=games.filter(g=>!matchingTop.has(g.key)).map(g=>({
        ...g,
        score:scoreCandidate(g,query,history,maxPlays),
        played:playedKeys.has(g.key)
      })).sort((a,b)=>b.score-a.score||a.title.localeCompare(b.title));

      if(!recItems.length){recSection.classList.remove('is-visible');return;}
      recGrid.innerHTML='';recOffset=0;
      recItems.slice(0,Math.min(20,recItems.length)).forEach(game=>{
        const button=document.createElement('button');button.type='button';button.className='search-recommendation';
        const img=document.createElement('img');img.loading='lazy';img.src=game.image;img.alt=game.title;
        const span=document.createElement('span');span.textContent=game.title;
        button.append(img,span);
        button.addEventListener('click',()=>{game.card.click();});
        recGrid.appendChild(button);
      });
      recSection.classList.add('is-visible');
      paintTrack();
    }

    document.addEventListener('click',event=>{
      const card=event.target.closest('#gameGrid > .game-card');
      if(card){
        const game=scrape().find(g=>g.card===card);
        if(game)recordGame(game);
      }
    },true);

    let lastQuery='';
    function refresh(){
      const q=searchInput.value.trim();
      if(q===lastQuery)return;
      lastQuery=q;renderPersonalized(q);
    }
    searchInput.addEventListener('input',()=>{lastQuery='';setTimeout(refresh,0);});
    searchInput.addEventListener('change',()=>{lastQuery='';refresh();});
    searchInput.addEventListener('focus',()=>{if(searchInput.value.trim())refresh();});
    new MutationObserver(()=>{if(searchInput.value.trim())renderPersonalized(searchInput.value.trim());}).observe(gameGridEl,{childList:true,subtree:false});
    window.addEventListener('storage',()=>{if(searchInput.value.trim())renderPersonalized(searchInput.value.trim());});
    refresh();
  })();
'''

          s = s.replace(marker, marker + block, 1)
          style_marker = '  const searchBar=document.getElementById(\'searchBar\');'
          css = r'''
    <style id="personalized-recommendation-style">
      .search-recommendations-header{align-items:center;position:relative}
      .recommendation-arrow{width:36px;height:36px;flex:0 0 36px;border:1px solid rgba(255,255,255,.35);border-radius:10px;background:rgba(0,73,190,.72);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px;line-height:1;box-shadow:0 5px 15px rgba(0,15,55,.2);transition:transform .16s ease,background .16s ease,box-shadow .16s ease}
      .recommendation-arrow:hover:not(:disabled){transform:translateX(2px) scale(1.06);background:rgba(0,83,213,.9);box-shadow:0 8px 19px rgba(0,15,55,.28)}
      .recommendation-arrow:active:not(:disabled){transform:translateX(1px) scale(.97)}
      .recommendation-arrow:disabled{opacity:.42;cursor:default}
      .recommendation-arrow.is-hidden{display:none}
      #searchRecommendationsGrid.recommendation-track{display:flex;overflow:hidden;gap:13px;width:100%;grid-template-columns:none}
      #searchRecommendationsGrid.recommendation-track .search-recommendation{flex:0 0 calc((100% - 39px)/4);min-width:0;transition:transform .22s ease,box-shadow .18s ease;will-change:transform}
      #searchRecommendationsGrid.recommendation-track .search-recommendation.is-shifted{transform:translateX(calc(-100% - 13px));}
      @media(max-width:900px){#searchRecommendationsGrid.recommendation-track .search-recommendation{flex-basis:calc((100% - 26px)/3)} }
      @media(max-width:570px){#searchRecommendationsGrid.recommendation-track .search-recommendation{flex-basis:calc((100% - 13px)/2)} }
      @media(max-width:900px){.recommendation-arrow{width:34px;height:34px;flex-basis:34px}}
    </style>
'''
          s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          print('Personalized recommendations installed')
          PY
      - name: Commit homepage update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add personalized recommendation carousel' || exit 0
          git push
