name: Apply personalized recommendations

on:
  push:
    paths:
      - '.github/recommendations-trigger'

permissions:
  contents: write

jobs:
  personalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/apply_recommendations.py
      - name: Commit homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add personalized recommendation carousel' || exit 0
          git push
