name: Update trending category

on:
  push:
    paths:
      - '.github/trending-trigger'
      - '.github/trending_update.py'
permissions:
  contents: write
jobs:
  trending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply trending update
        run: python3 .github/trending_update.py
      - name: Commit homepage update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add three-day trending category' || exit 0
          git push
