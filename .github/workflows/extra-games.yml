name: Verified extra game expansion
on:
  push:
    paths:
      - '.github/extra-games.py'
      - '.github/stable-runtime-hotfix.py'
      - '.github/site-finalizer.py'
      - '.github/workflows/extra-games.yml'
      - '.github/library-guard.py'
      - '.github/library_guard.py'
      - '.github/game_validator.py'
      - '.github/interaction-polish.py'
      - '.github/search-rail-visibility.py'
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ubg43-maintenance
  cancel-in-progress: false
jobs:
  expand:
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[automation-hardening]') && !contains(github.event.head_commit.message, '[live-fix]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Add verified extra games
        run: python3 .github/extra-games.py
      - name: Remove duplicate game cards
        run: python3 .github/dedupe-games.py
      - name: Enforce duplicate-free library
        run: python3 .github/library-guard.py
      - name: Apply automatic categories
        run: python3 .github/category-enhancer.py
      - name: Apply four-day homepage shuffle
        run: python3 .github/home-order.py
      - name: Remove obsolete loading placeholder
        run: python3 .github/loading-polish.py
      - name: Apply final UBG43 UI polish
        run: python3 .github/repair-ui.py
      - name: Harden stable runtime and restore interaction badges
        run: python3 .github/stable-runtime-hotfix.py
      - name: Apply final link and runtime sanity fixes
        run: python3 .github/site-finalizer.py
      - name: Apply UBG43 search and badge interaction polish
        run: python3 .github/interaction-polish.py
      - name: Apply search rail visibility rules
        run: python3 .github/search-rail-visibility.py
      - name: Commit expansion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html legacy-index.html .github/stable-runtime-hotfix.py .github/interaction-polish.py .github/search-rail-visibility.py
          git commit -m 'Expand verified game library [game-builder]' || exit 0
          git fetch origin main
          git rebase origin/main
          git push
