name: Add favorites system
on:
  push:
    paths:
      - '.github/favorites-polish.py'
permissions:
  contents: write
jobs:
  favorites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply favorites system
        run: python3 .github/favorites-polish.py
      - name: Commit favorites update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add favorites system to homepage'
          git push
