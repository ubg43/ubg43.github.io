name: Automatic game categories
on:
  push:
    paths:
      - '.github/auto-categories.py'
      - '.github/loading-polish.py'
      - '.github/auto-categories-trigger'
      - 'legacy-index.html'
      - 'index.html'
permissions:
  contents: write
jobs:
  categories:
    if: ${{ !contains(github.event.head_commit.message, '[game-builder]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply automatic categories and smart discovery
        run: python3 .github/auto-categories.py
      - name: Apply loading-state polish
        run: python3 .github/loading-polish.py
      - name: Commit category update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html legacy-index.html .github/game-registry.json
          git commit -m 'Refresh game library automation [game-builder]' || exit 0
          git push
