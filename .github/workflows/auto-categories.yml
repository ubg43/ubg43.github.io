name: Automatic game library maintenance
on:
  schedule:
    - cron: '17 2 * * *'
  push:
    paths:
      - '.github/auto-categories.py'
      - '.github/category-enhancer.py'
      - '.github/home-order.py'
      - '.github/loading-polish.py'
      - '.github/auto-categories-trigger'
      - '.github/repair-ui.py'
      - 'legacy-index.html'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  categories:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[game-builder]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Repair interactive UI
        run: python3 .github/repair-ui.py
      - name: Apply automatic categories and smart discovery
        run: python3 .github/auto-categories.py
      - name: Apply expanded categories
        run: python3 .github/category-enhancer.py
      - name: Apply four-day homepage shuffle
        run: python3 .github/home-order.py
      - name: Apply loading-state polish
        run: python3 .github/loading-polish.py
      - name: Commit automation update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html legacy-index.html .github/game-registry.json
          git commit -m 'Repair site interactions and refresh library [game-builder]' || exit 0
          git push
