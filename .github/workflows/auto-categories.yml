name: Automatic game categories
on:
  push:
    paths:
      - '.github/auto-categories.py'
      - '.github/auto-categories-trigger'
permissions:
  contents: write
jobs:
  categories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply automatic categories
        run: python3 .github/auto-categories.py
      - name: Commit category update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Improve automatic game categories' || exit 0
          git push
