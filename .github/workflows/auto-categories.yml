name: Automatic game library maintenance
on:
  schedule:
    - cron: '17 2 * * *'
  push:
    paths:
      - '.github/auto-categories.py'
      - '.github/category-enhancer.py'
      - '.github/home-order.py'
      - '.github/loading-polish.py'
      - '.github/dedupe-games.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ubg43-maintenance
  cancel-in-progress: false
jobs:
  categories:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, '[game-builder]') && !contains(github.event.head_commit.message, '[live-fix]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Make builder resilient to partial upstream verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/auto-categories.py')
          s=p.read_text(encoding='utf-8')
          old="if len(combined)<1000:raise SystemExit(f'Only {len(combined)} verified games available; refusing incomplete library')"
          new="if len(combined)<1000:\n  print(f'Only {len(combined)} verified games available in this pass; retaining the verified library and continuing')\nif len(combined)<900:raise SystemExit(f'Only {len(combined)} verified games available; refusing unsafe small library')"
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Apply automatic categories and verified discovery
        run: python3 .github/auto-categories.py
      - name: Remove duplicate game cards
        run: python3 .github/dedupe-games.py
      - name: Apply expanded categories
        run: python3 .github/category-enhancer.py
      - name: Apply four-day homepage shuffle
        run: python3 .github/home-order.py
      - name: Remove obsolete loading placeholder
        run: python3 .github/loading-polish.py
      - name: Apply final UBG43 UI polish
        run: python3 .github/repair-ui.py
      - name: Harden stable runtime and restore interaction badges
        run: python3 .github/stable-runtime-hotfix.py
      - name: Apply final link and runtime sanity fixes
        run: python3 .github/site-finalizer.py
      - name: Commit automation update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html legacy-index.html .github/game-registry.json .github/auto-categories.py
          git commit -m 'Refresh verified game library and UBG43 UI [game-builder]' || exit 0
          git push
