name: Validate homepage JavaScript
on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/debug-supabase-syntax.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check homepage scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          idx=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script([^>]*)>(.*?)</script>',idx,re.I|re.S)
          errors=[]
          with tempfile.TemporaryDirectory() as td:
              for i,(attrs,body) in enumerate(scripts):
                  if 'application/ld+json' in attrs.lower() or not body.strip():
                      continue
                  f=Path(td)/f'script{i}.js'
                  f.write_text(body,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode:
                      errors.append(r.stderr.strip() or f'Script {i} failed syntax validation')
          if errors:
              raise SystemExit('HOMEPAGE JAVASCRIPT FAILED:\n'+'\n'.join(errors))
          print('HOMEPAGE JAVASCRIPT PASSED')
          PY
