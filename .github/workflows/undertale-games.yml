name: Undertale game collection
on:
  push:
    paths:
      - '.github/undertale-games.py'
      - 'undertale-thumbnails/**'
  schedule:
    - cron: '29 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  undertale:
    if: ${{ !contains(github.event.head_commit.message, '[undertale-builder]') || github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add and maintain Undertale games
        run: python3 .github/undertale-games.py
      - name: Commit Undertale collection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html legacy-index.html undertale-thumbnails
          git commit -m 'Refresh Undertale game collection [undertale-builder]' || exit 0
          git push
