name: Undertale game collection
on:
  push:
    paths:
      - '.github/undertale-games.py'
      - '.github/stable-runtime-hotfix.py'
      - '.github/resolve-game-images.py'
      - '.github/site-finalizer.py'
      - '.github/library-guard.py'
      - '.github/library_guard.py'
      - '.github/game_validator.py'
      - '.github/workflows/undertale-games.yml'
      - 'undertale-thumbnails/**'
  schedule:
    - cron: '29 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ubg43-maintenance
  cancel-in-progress: false
jobs:
  undertale:
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[undertale-builder]') && !contains(github.event.head_commit.message, '[automation-hardening]') && !contains(github.event.head_commit.message, '[live-fix]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Add and verify Undertale games
        run: python3 .github/undertale-games.py
      - name: Remove duplicate game cards
        run: python3 .github/dedupe-games.py
      - name: Enforce duplicate-free library
        run: python3 .github/library-guard.py
      - name: Apply automatic categories
        run: python3 .github/category-enhancer.py
      - name: Apply four-day homepage shuffle
        run: python3 .github/home-order.py
      - name: Remove obsolete loading placeholder
        run: python3 .github/loading-polish.py
      - name: Rebuild stable UBG43 homepage
        run: python3 .github/repair-ui.py
      - name: Resolve real game cover images
        run: python3 .github/resolve-game-images.py
      - name: Harden stable runtime and restore NEW/TRENDING badges
        run: python3 .github/stable-runtime-hotfix.py
      - name: Final site sanity check
        run: python3 .github/site-finalizer.py
      - name: Apply UBG43 search and badge interaction polish
        run: python3 .github/interaction-polish.py
      - name: Apply search rail visibility rules
        run: python3 .github/search-rail-visibility.py
      - name: Commit Undertale collection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html legacy-index.html undertale-thumbnails .github/interaction-polish.py .github/stable-runtime-hotfix.py .github/game-registry.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Undertale game collection [undertale-builder]'
          git fetch origin main
          git rebase origin/main
          git push
