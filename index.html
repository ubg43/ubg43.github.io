<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Docs</title>
  <meta name="description" content="Play unblocked games online.">
  <link rel="shortcut icon" href="Docs.ico" type="image/ico">
  <style>
    :root{
      --blue:#004dcc;
      --blue-deep:#003ea8;
      --ink:#142039;
      --muted:#75829a;
      --panel:#ffffff;
      --line:rgba(16,34,70,.10);
      --shadow:0 12px 32px rgba(6,23,58,.18);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(67, 131, 255, .22), transparent 28%),
        radial-gradient(circle at 82% 24%, rgba(139, 92, 246, .18), transparent 26%),
        radial-gradient(circle at 50% 88%, rgba(20, 184, 166, .13), transparent 30%),
        linear-gradient(135deg, #07142f 0%, #0b2250 45%, #111936 100%);
      color:var(--ink);
    }
    button,input{font:inherit}
    .site-header{
      position:sticky;
      top:0;
      z-index:1000;
      width:100%;
      background:var(--blue);
      box-shadow:0 4px 18px rgba(0,24,80,.24);
    }
    .header-inner{
      width:min(1440px,100%);
      min-height:74px;
      margin:0 auto;
      padding:11px 20px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .search-shell{position:relative;flex:0 1 330px;width:330px;max-width:330px;z-index:1005}
    #searchBar{
      width:100%;
      height:44px;
      padding:0 42px 0 43px;
      border:1px solid rgba(255,255,255,.82);
      border-radius:13px;
      outline:none;
      background:#fff;
      color:var(--ink);
      font-size:15px;
      font-weight:600;
      box-shadow:0 7px 19px rgba(0,34,102,.20),inset 0 1px 0 #fff;
      transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
    }
    #searchBar::placeholder{color:#78849a;font-weight:500}
    #searchBar:focus{transform:translateY(-1px);border-color:#fff;box-shadow:0 10px 25px rgba(0,25,88,.26),0 0 0 4px rgba(255,255,255,.16)}
    .search-icon{position:absolute;left:15px;top:50%;width:16px;height:16px;transform:translateY(-58%);border:2px solid #6c7890;border-radius:50%;pointer-events:none}
    .search-icon:after{content:"";position:absolute;right:-5px;bottom:-2px;width:7px;height:2px;border-radius:2px;background:#6c7890;transform:rotate(45deg);transform-origin:left center}
    .search-clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);display:none;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#69758a;cursor:pointer;font-size:19px;font-weight:800;line-height:1;z-index:2;transition:transform .15s ease,background .15s ease}
    .search-clear:hover{background:#eef3fb;transform:translateY(-50%) scale(1.05)}
    .search-results{position:absolute;left:0;top:calc(100% + 8px);display:none;width:100%;padding:6px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.99);box-shadow:0 18px 42px rgba(5,24,63,.28);overflow:hidden}
    .search-results.is-open{display:block;animation:dropIn .16s ease-out}
    @keyframes dropIn{from{opacity:0;transform:translateY(-5px) scale(.985)}to{opacity:1;transform:none}}
    .search-result{width:100%;min-height:58px;padding:7px 8px;display:flex;align-items:center;gap:11px;border:0;border-radius:10px;background:transparent;color:var(--ink);text-align:left;cursor:pointer;transition:background .14s ease,transform .14s ease}
    .search-result:hover,.search-result.is-active{background:#f1f5fc;transform:scale(1.012)}
    .search-result img{width:44px;height:44px;flex:0 0 44px;object-fit:cover;border-radius:9px;background:#e9eef7;box-shadow:0 2px 8px rgba(0,0,0,.13)}
    .search-result-copy{min-width:0}.search-result-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:800;line-height:1.25}.search-result-label{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:650}
    .search-empty{padding:14px 10px;color:var(--muted);font-size:13px;text-align:center}
    .header-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
    .header-action{width:148px;height:38px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;border:1px solid rgba(255,255,255,.42);border-radius:11px;background:#0849b6;color:#fff;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;box-shadow:0 5px 14px rgba(0,30,100,.20),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .16s ease,background .16s ease,box-shadow .16s ease}
    .header-action:hover{transform:translateY(-2px) scale(1.035);background:#063f9f;box-shadow:0 9px 21px rgba(0,30,100,.28),inset 0 1px 0 rgba(255,255,255,.26)}
    .header-action:active{transform:translateY(1px) scale(.98)}
    .action-icon{font-size:15px;line-height:1}
    .mc-text{font-family:"Pixelify Sans",sans-serif;font-optical-sizing:auto;font-weight:400;font-style:normal;color:#ffff00;display:inline-block;position:absolute;left:1070px;top:35px;white-space:nowrap;text-shadow:1px 1px 0 #000;transform:rotate(-15deg);animation:splash 1.2s infinite ease-in-out}
    .page-wrap{width:min(1440px,100%);margin:0 auto}
    .loading-card,.error-card{margin:24px 22px;padding:22px;border-radius:14px;background:rgba(255,255,255,.96);box-shadow:var(--shadow);text-align:center;color:var(--muted)}
    .game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:17px;padding:22px}
    .game-card{position:relative;background:rgba(255,255,255,.98);border-radius:14px;overflow:hidden;box-shadow:0 5px 16px rgba(0,0,0,.12);cursor:pointer;transition:transform .20s cubic-bezier(.2,.8,.2,1),box-shadow .20s ease}
    .game-card:hover{transform:translateY(-6px) scale(1.025);box-shadow:0 15px 30px rgba(3,20,55,.24)}
    .game-card img{display:block;width:100%;height:140px;object-fit:cover;transition:transform .22s ease,filter .22s ease}
    .game-card:hover img{transform:scale(1.04);filter:saturate(1.05)}
    .game-card h3{margin:10px 10px 12px;color:#172039;font-size:15px;line-height:1.3;text-align:center}
    .search-recommendations{display:none;padding:2px 22px 30px}
    .search-recommendations.is-visible{display:block;animation:recommendIn .20s ease-out}
    @keyframes recommendIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    .search-recommendations-header{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:5px 0 12px}
    .search-recommendations-title{margin:0;color:#fff;font-size:20px;line-height:1.2;font-weight:850;text-shadow:0 2px 5px rgba(0,0,0,.25)}
    .search-recommendations-subtitle{margin:0;color:rgba(255,255,255,.72);font-size:12px;font-weight:650}
    .search-recommendations-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:13px}
    .search-recommendation{appearance:none;width:100%;padding:0;overflow:hidden;border:0;border-radius:13px;background:#fff;text-align:left;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.12);transition:transform .18s ease,box-shadow .18s ease}
    .search-recommendation:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 13px 24px rgba(0,0,0,.20)}
    .search-recommendation img{display:block;width:100%;height:112px;object-fit:cover}
    .search-recommendation span{display:block;padding:9px 10px 11px;color:#1b2740;font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    footer{background:var(--blue);color:#fff;text-align:center;padding:20px;font-size:14px}
    footer p{margin:4px 0}.footer-muted{opacity:.82}
    @media(max-width:1050px){.search-shell{flex-basis:280px;width:280px;max-width:280px}.header-action{width:138px}.mc-text{font-size:14px}}
    @media(max-width:830px){.header-inner{flex-wrap:wrap;padding:11px 14px}.search-shell{order:1;flex:1 1 100%;width:100%;max-width:none}.header-actions{order:2;flex:1 1 auto}.header-action{width:148px;min-width:0}.mc-text{order:3;margin-left:auto;margin-right:4px}}
    @media(max-width:570px){.header-actions{width:100%;display:grid;grid-template-columns:1fr 1fr}.header-action{width:100%}.mc-text{display:none}.game-grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px;gap:12px}.search-recommendations{padding-left:14px;padding-right:14px}.search-recommendations-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.search-recommendation img{height:92px}.game-card img{height:112px}}
  
    @keyframes splash {
      0% { transform: rotate(-15deg) scale(0.95) translateY(0px); }
      25% { transform: rotate(-15deg) scale(1.15) translateY(0px); }
      50% { transform: rotate(-15deg) scale(0.95) translateY(0px); }
      75% { transform: rotate(-15deg) scale(1.2) translateY(0px); }
      100% { transform: rotate(-15deg) scale(0.95) translateY(0px); }
    }

    .category-toggle{height:38px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;border:1px solid rgba(255,255,255,.42);border-radius:11px;background:#0849b6;color:#fff;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;box-shadow:0 5px 14px rgba(0,30,100,.20),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .16s ease,background .16s ease,box-shadow .16s ease}
    .category-toggle:hover{transform:translateY(-2px) scale(1.035);background:#063f9f;box-shadow:0 9px 21px rgba(0,30,100,.28),inset 0 1px 0 rgba(255,255,255,.26)}
    .category-toggle:active{transform:translateY(1px) scale(.98)}
    .category-toggle-icon{font-size:15px;line-height:1}
    .category-overlay{position:fixed;inset:0;background:rgba(1,9,28,.48);backdrop-filter:blur(2px);z-index:1090;opacity:0;transition:opacity .2s ease}
    .category-overlay.is-open{opacity:1}
    .category-sidebar{position:fixed;top:0;right:0;height:100vh;width:min(350px,88vw);background:linear-gradient(180deg,#061734 0%,#0b2350 100%);color:#fff;z-index:1100;box-shadow:-18px 0 42px rgba(0,10,35,.35);transform:translateX(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
    .category-sidebar.is-open{transform:none}
    .category-sidebar-header{padding:24px 20px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;border-bottom:1px solid rgba(255,255,255,.1)}
    .category-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:rgba(255,255,255,.55);font-weight:800;margin-bottom:4px}
    .category-sidebar-header h2{margin:0;font-size:22px;line-height:1.2;font-weight:850}
    .category-close{width:34px;height:34px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.06);color:#fff;font-size:25px;line-height:1;cursor:pointer;transition:background .15s ease,transform .15s ease}
    .category-close:hover{background:rgba(255,255,255,.12);transform:scale(1.05)}
    .category-list{padding:14px 12px 20px;overflow:auto}
    .category-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 13px;margin:4px 0;border:1px solid transparent;border-radius:12px;background:transparent;color:#fff;text-align:left;cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .15s ease}
    .category-item:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.09);transform:translateX(-2px)}
    .category-item.is-active{background:rgba(37,115,255,.24);border-color:rgba(76,146,255,.34)}
    .category-item-main{display:flex;align-items:center;gap:10px;min-width:0}
    .category-dot{width:9px;height:9px;border-radius:50%;background:#4d91ff;box-shadow:0 0 0 4px rgba(77,145,255,.12);flex:0 0 auto}
    .category-name{font-size:14px;font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .category-count{min-width:30px;height:24px;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.76);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
    body.category-locked{overflow:hidden}
    @media(max-width:830px){.category-toggle-label{display:none}.category-toggle{width:42px;padding:0}.header-actions{margin-left:auto}}
    @media(max-width:570px){.category-toggle{width:100%;height:38px}.header-actions{margin-left:0}}
</style>

<style id="personalized-recommendation-style">
  .search-recommendations-header{align-items:center;position:relative}
  .recommendation-arrow{width:36px;height:36px;flex:0 0 36px;border:1px solid rgba(255,255,255,.35);border-radius:10px;background:rgba(0,58,160,.80);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px;line-height:1;box-shadow:0 5px 15px rgba(0,15,55,.2);transition:transform .16s ease,background .16s ease,box-shadow .16s ease}
  .recommendation-arrow:hover:not(:disabled){transform:translateX(2px) scale(1.06);background:rgba(0,68,182,.93);box-shadow:0 8px 19px rgba(0,15,55,.28)}
  .recommendation-arrow:active:not(:disabled){transform:translateX(1px) scale(.97)}
  .recommendation-arrow:disabled{opacity:.42;cursor:default}
  .recommendation-arrow.is-hidden{display:none}
  #searchRecommendationsGrid.recommendation-track{display:flex;overflow:hidden;gap:13px;width:100%;grid-template-columns:none}
  #searchRecommendationsGrid.recommendation-track .search-recommendation{flex:0 0 calc((100% - 39px)/4);min-width:0;transition:transform .22s ease,box-shadow .18s ease;will-change:transform}
  #searchRecommendationsGrid.recommendation-track .search-recommendation.is-shifted{transform:translateX(calc(-100% - 13px));}
  @media(max-width:900px){#searchRecommendationsGrid.recommendation-track .search-recommendation{flex-basis:calc((100% - 26px)/3)}.recommendation-arrow{width:34px;height:34px;flex-basis:34px}}
  @media(max-width:570px){#searchRecommendationsGrid.recommendation-track .search-recommendation{flex-basis:calc((100% - 13px)/2)}}
</style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="search-shell" role="search">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="searchBar" type="search" placeholder="Search games..." autocomplete="off" spellcheck="false" aria-label="Search games" aria-controls="searchResults" aria-expanded="false">
        <button id="searchClear" class="search-clear" type="button" aria-label="Clear search">×</button>
        <div id="searchResults" class="search-results" role="listbox" aria-label="Game suggestions"></div>
      </div>
      <nav class="header-actions" aria-label="Game actions">
        <button class="header-action" id="randomGameButton" type="button"><span class="action-icon" aria-hidden="true">🎲</span><span>Random Game</span></button>
        <button class="header-action" id="reportGameButton" type="button"><span class="action-icon" aria-hidden="true">📝</span><span>Report / Suggest</span></button>
      </nav>
      <button class="category-toggle" id="categoryToggle" type="button" aria-label="Open game categories" aria-controls="categorySidebar" aria-expanded="false">
        <span class="category-toggle-icon" aria-hidden="true">☰</span>
        <span class="category-toggle-label">Categories</span>
      </button>
    </div>
  </header>

  <div class="category-overlay" id="categoryOverlay" hidden></div>
  <aside class="category-sidebar" id="categorySidebar" aria-label="Game categories" aria-hidden="true">
    <div class="category-sidebar-header">
      <div>
        <div class="category-kicker">Browse</div>
        <h2>Game Categories</h2>
      </div>
      <button class="category-close" id="categoryClose" type="button" aria-label="Close categories">×</button>
    </div>
    <div class="category-list" id="categoryList"></div>
  </aside>

  <main class="page-wrap">
    <div id="loadingCard" class="loading-card">Loading games...</div>
    <div class="game-grid" id="gameGrid">
      <!-- Add new game cards here. Search and Random Game discover them automatically. -->
    </div>
    <section id="searchRecommendations" class="search-recommendations" aria-live="polite">
      <div class="search-recommendations-header">
        <h2 class="search-recommendations-title">You may also like</h2>
        <p class="search-recommendations-subtitle">More games to try</p>
      </div>
      <div class="search-recommendations-grid" id="searchRecommendationsGrid"></div>
    </section>
  </main>

  <footer>
    <p class="footer-muted">© 2026 All rights reserved.</p>
    <noscript><p><a href="legacy-index.html" style="color:#fff">Open the full game library</a></p></noscript>
  </footer>

  <script>
  function openGame(url){
    if(!url)return;
    const tab=window.open('about:blank','_blank');
    if(!tab)return;
    const safe=String(url).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    tab.document.write('<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Docs</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{width:100%;height:100%;border:0}</style></head><body><iframe src="'+safe+'" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"></iframe></body></html>');
    tab.document.close();
  }

  const searchBar=document.getElementById('searchBar');
  const searchResults=document.getElementById('searchResults');
  const searchClear=document.getElementById('searchClear');
  const gameGrid=document.getElementById('gameGrid');
  const loadingCard=document.getElementById('loadingCard');
  const recWrap=document.getElementById('searchRecommendations');
  const recGrid=document.getElementById('searchRecommendationsGrid');
  const randomButton=document.getElementById('randomGameButton');
  const reportButton=document.getElementById('reportGameButton');

  const normalize=s=>(s||'').toString().trim().toLowerCase();
  function scrapeGames(){
    return Array.from(gameGrid.querySelectorAll(':scope > .game-card')).map((card,index)=>({
      card,index,
      title:(card.querySelector('h3')?.textContent||card.querySelector('img')?.alt||'Game').trim(),
      image:card.querySelector('img')?.currentSrc||card.querySelector('img')?.src||''
    })).filter(g=>g.title);
  }
  function rank(title,query){
    const t=normalize(title),q=normalize(query),words=t.split(/\s+/),queryWords=q.split(/\s+/).filter(Boolean);
    if(!q)return 99;
    if(t===q)return 0;
    if(t.startsWith(q))return 1;
    if(words.some(w=>w.startsWith(q)))return 2;
    const overlap=queryWords.filter(x=>words.some(w=>w.includes(x))).length;
    if(overlap===queryWords.length&&overlap)return 2.5;
    if(t.includes(q))return 3;
    return 99;
  }
  function matched(query){
    return scrapeGames().map(g=>({...g,score:rank(g.title,query)})).filter(g=>g.score<99).sort((a,b)=>a.score-b.score||a.title.localeCompare(b.title));
  }

  function closeSearch(){searchResults.classList.remove('is-open');searchBar.setAttribute('aria-expanded','false');}
  function openSearch(){searchResults.classList.add('is-open');searchBar.setAttribute('aria-expanded','true');}

  function renderSuggestions(query){
    searchResults.innerHTML='';
    if(!query){closeSearch();return;}
    const top=matched(query).slice(0,5);
    if(!top.length){
      searchResults.innerHTML='<div class="search-empty">No matching games yet</div>';
      openSearch();
      return;
    }
    top.forEach((game,i)=>{
      const button=document.createElement('button');
      button.type='button';button.className='search-result';button.setAttribute('role','option');
      button.innerHTML='<img loading="lazy" alt=""><span class="search-result-copy"><span class="search-result-title"></span><span class="search-result-label">Play game</span></span>';
      const img=button.querySelector('img');img.src=game.image;img.alt=game.title;
      button.querySelector('.search-result-title').textContent=game.title;
      button.dataset.index=String(i);
      button.addEventListener('click',()=>{clickSound();closeSearch();searchBar.value=game.title;searchClear.style.display='block';game.card.click();renderRecommendations(game.title);});
      searchResults.appendChild(button);
    });
    openSearch();
  }

  function renderRecommendations(query){
    if(!recWrap||!recGrid)return;
    if(!query){recGrid.innerHTML='';recWrap.classList.remove('is-visible');return;}
    const topSet=new Set(matched(query).slice(0,5).map(g=>g.card));
    const qWords=normalize(query).split(/\s+/).filter(Boolean);
    const pool=scrapeGames().filter(g=>!topSet.has(g.card));
    const picks=pool.map(g=>{
      const words=normalize(g.title).split(/\s+/);
      const overlap=qWords.reduce((n,w)=>n+(words.some(x=>x.includes(w))?1:0),0);
      return {...g,overlap,r:Math.random()};
    }).sort((a,b)=>b.overlap-a.overlap||b.r-a.r).slice(0,6);
    recGrid.innerHTML='';
    picks.forEach(game=>{
      const button=document.createElement('button');button.type='button';button.className='search-recommendation';
      const img=document.createElement('img');img.loading='lazy';img.src=game.image;img.alt=game.title;
      const span=document.createElement('span');span.textContent=game.title;
      button.append(img,span);
      button.addEventListener('click',()=>{clickSound();game.card.click();});
      recGrid.appendChild(button);
    });
    recWrap.classList.toggle('is-visible',picks.length>0);
  }

  searchBar.addEventListener('input',()=>{
    const query=searchBar.value.trim();
    searchClear.style.display=query?'block':'none';
    renderSuggestions(query);
    renderRecommendations(query);
    scrapeGames().forEach(g=>{g.card.style.display=!query||rank(g.title,query)<99?'':'none';});
  });
  searchBar.addEventListener('focus',()=>{if(searchBar.value.trim())renderSuggestions(searchBar.value.trim());});
  searchBar.addEventListener('keydown',e=>{
    const items=[...searchResults.querySelectorAll('.search-result')];
    if(e.key==='ArrowDown'&&items.length){e.preventDefault();let i=items.findIndex(x=>x.classList.contains('is-active'));i=(i+1)%items.length;items.forEach((x,j)=>x.classList.toggle('is-active',j===i));}
    else if(e.key==='ArrowUp'&&items.length){e.preventDefault();let i=items.findIndex(x=>x.classList.contains('is-active'));i=i<=0?items.length-1:i-1;items.forEach((x,j)=>x.classList.toggle('is-active',j===i));}
    else if(e.key==='Enter'){const active=searchResults.querySelector('.search-result.is-active');if(active){e.preventDefault();active.click();}}
    else if(e.key==='Escape')closeSearch();
  });
  searchClear.addEventListener('click',()=>{clickSound();searchBar.value='';searchClear.style.display='none';scrapeGames().forEach(g=>g.card.style.display='');closeSearch();renderRecommendations('');searchBar.focus();});
  document.addEventListener('click',e=>{if(!e.target.closest('.search-shell'))closeSearch();});

  randomButton.addEventListener('click',()=>{
    const available=scrapeGames().filter(g=>g.card.style.display!=='none');
    const pool=available.length?available:scrapeGames();
    if(!pool.length)return;
    const game=pool[Math.floor(Math.random()*pool.length)];
    game.card.click();
  });
  reportButton.addEventListener('click',()=>{window.location.href='mailto:ubg423@gmail.com?subject=UBG%20Problem%20%2F%20Game%20Suggestion';});

  let audioContext=null;
  function clickSound(){
    try{
      audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();
      if(audioContext.state==='suspended')audioContext.resume();
      const now=audioContext.currentTime,gain=audioContext.createGain(),a=audioContext.createOscillator(),b=audioContext.createOscillator();
      a.type='sine';b.type='triangle';a.frequency.setValueAtTime(560,now);b.frequency.setValueAtTime(900,now);
      gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.045,now+.008);gain.gain.exponentialRampToValueAtTime(.0001,now+.075);
      a.connect(gain);b.connect(gain);gain.connect(audioContext.destination);a.start(now);b.start(now);a.stop(now+.08);b.stop(now+.08);
    }catch(_){}
  }
  document.addEventListener('click',e=>{
    if(e.target.closest('.search-result,.search-recommendation'))return;
    if(e.target.closest('button,.game-card'))clickSound();
  },true);

  async function loadLegacyGames(){
    try{
      const custom=Array.from(gameGrid.children).filter(el=>el.classList.contains('game-card'));
      const response=await fetch('legacy-index.html',{cache:'no-store'});
      if(!response.ok)throw new Error('Legacy library unavailable');
      const text=await response.text();
      const doc=new DOMParser().parseFromString(text,'text/html');
      const legacy=doc.querySelector('#gameGrid');
      if(!legacy)throw new Error('Game library not found');
      const legacyCards=Array.from(legacy.querySelectorAll(':scope > .game-card'));
      gameGrid.innerHTML='';
      legacyCards.forEach(card=>gameGrid.appendChild(document.importNode(card,true)));
      custom.forEach(card=>gameGrid.appendChild(card));
      loadingCard.style.display='none';
    }catch(err){
      loadingCard.className='error-card';
      loadingCard.textContent='The game library could not be loaded right now. Refresh the page to try again.';
    }
  }

  loadLegacyGames();


  /* Automatic game categories */
  (function(){
    const toggle=document.getElementById('categoryToggle');
    const close=document.getElementById('categoryClose');
    const sidebar=document.getElementById('categorySidebar');
    const overlay=document.getElementById('categoryOverlay');
    const list=document.getElementById('categoryList');
    const grid=document.getElementById('gameGrid');
    if(!toggle||!close||!sidebar||!overlay||!list||!grid)return;

    const CATEGORY_RULES=[
      ['Action',['action','shooter','combat','battle','fight','war','zombie','ninja','stickman','assassin','gun','sniper','strike','rush']],
      ['Adventure',['adventure','quest','platform','dungeon','maze','escape','explore','survival','island','parkour']],
      ['Arcade',['arcade','flappy','runner','run','jump','brick','ball','bubble','match','pinball','snake']],
      ['Puzzle',['puzzle','logic','sudoku','2048','mahjong','word','memory','connect','block','brain','sort','merge']],
      ['Racing',['racing','race','drift','car','cars','motor','bike','bmx','kart','traffic','drive']],
      ['Sports',['football','soccer','basketball','baseball','golf','tennis','hockey','volleyball','bowling','pool','sports','skate','ski']],
      ['Strategy',['strategy','tower','defense','defence','battle','td','idle','tycoon','manager','kingdom','chess','checkers']],
      ['Simulation',['simulator','simulation','farming','farm','restaurant','cooking','shop','business','city','hotel','airport','life','house']],
      ['Multiplayer',['multiplayer','2 player','2p','io','agar','slither','online']],
      ['Casual',['clicker','idle','dress','makeup','color','drawing','quiz','trivia','fun','cute']]
    ];
    const categories=['All Games',...CATEGORY_RULES.map(x=>x[0])];
    let active='All Games';

    const normalize=s=>(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
    function games(){return Array.from(grid.querySelectorAll(':scope > .game-card')).map(card=>({card,title:(card.querySelector('h3')?.textContent||card.querySelector('img')?.alt||'Game').trim()}));}
    function categoryFor(title){
      const text=' '+normalize(title)+' ';
      const scores=CATEGORY_RULES.map(([name,words])=>[name,words.reduce((n,w)=>n+(text.includes(' '+normalize(w)+' ')?1:0),0)]);
      const best=scores.sort((a,b)=>b[1]-a[1])[0];
      return best&&best[1]>0?best[0]:'Casual';
    }
    function openSidebar(){sidebar.classList.add('is-open');overlay.hidden=false;requestAnimationFrame(()=>overlay.classList.add('is-open'));sidebar.setAttribute('aria-hidden','false');toggle.setAttribute('aria-expanded','true');document.body.classList.add('category-locked');render();}
    function closeSidebar(){sidebar.classList.remove('is-open');overlay.classList.remove('is-open');sidebar.setAttribute('aria-hidden','true');toggle.setAttribute('aria-expanded','false');document.body.classList.remove('category-locked');setTimeout(()=>{if(!sidebar.classList.contains('is-open'))overlay.hidden=true;},220);}
    function render(){
      const gs=games();
      const counts=Object.fromEntries(categories.map(c=>[c,0]));
      gs.forEach(g=>counts[categoryFor(g.title)]++);
      list.innerHTML='';
      categories.forEach(c=>{
        const btn=document.createElement('button');btn.type='button';btn.className='category-item'+(active===c?' is-active':'');
        btn.innerHTML='<span class="category-item-main"><span class="category-dot" aria-hidden="true"></span><span class="category-name"></span></span><span class="category-count"></span>';
        btn.querySelector('.category-name').textContent=c;btn.querySelector('.category-count').textContent=String(c==='All Games'?gs.length:counts[c]);
        btn.addEventListener('click',()=>{active=c;gs.forEach(g=>{const match=c==='All Games'||categoryFor(g.title)===c;g.card.style.display=match?'':'none';});list.querySelectorAll('.category-item').forEach(x=>x.classList.remove('is-active'));btn.classList.add('is-active');});
        list.appendChild(btn);
      });
    }
    toggle.addEventListener('click',()=>sidebar.classList.contains('is-open')?closeSidebar():openSidebar());
    close.addEventListener('click',closeSidebar);overlay.addEventListener('click',closeSidebar);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sidebar.classList.contains('is-open'))closeSidebar();});
    new MutationObserver(()=>{render();}).observe(grid,{childList:true});
    render();
  })();

  /* Personalized recommendation carousel */
  (function(){
    const recSection=document.getElementById('searchRecommendations');
    const recGrid=document.getElementById('searchRecommendationsGrid');
    const gameGridEl=document.getElementById('gameGrid');
    const searchInput=document.getElementById('searchBar');
    if(!recSection||!recGrid||!gameGridEl||!searchInput)return;

    const HISTORY_KEY='ubg_play_history_v2';
    const HISTORY_LIMIT=80;
    const normalizeText=s=>(s||'').toString().toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
    const stopWords=new Set(['the','and','for','with','game','games','play','new','online','3d','io','html','html5']);
    const tokens=s=>normalizeText(s).split(' ').filter(w=>w.length>1&&!stopWords.has(w));
    const gameKey=g=>normalizeText(g.title)+'|'+g.image;

    function readHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'{}')||{};}catch(_){return {};}}
    function writeHistory(history){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history));}catch(_){}
    }
    function recordGame(game){
      if(!game||!game.title)return;
      const history=readHistory(); const key=gameKey(game);
      const item=history[key]||{title:game.title,image:game.image,plays:0,lastPlayed:0,tokens:tokens(game.title)};
      item.title=game.title; item.image=game.image; item.tokens=tokens(game.title); item.plays+=1; item.lastPlayed=Date.now(); history[key]=item;
      const keys=Object.keys(history).sort((a,b)=>(history[b].lastPlayed||0)-(history[a].lastPlayed||0)).slice(0,HISTORY_LIMIT);
      const trimmed={}; keys.forEach(k=>trimmed[k]=history[k]); writeHistory(trimmed);
    }
    function scrape(){
      return Array.from(gameGridEl.querySelectorAll(':scope > .game-card')).map((card,index)=>({
        card,index,title:(card.querySelector('h3')?.textContent||card.querySelector('img')?.alt||'Game').trim(),image:card.querySelector('img')?.currentSrc||card.querySelector('img')?.src||''
      })).filter(g=>g.title).map(g=>({...g,key:gameKey(g)}));
    }
    function overlap(a,b){
      const A=new Set(tokens(a)),B=new Set(tokens(b)); if(!A.size||!B.size)return 0; let hit=0; A.forEach(x=>{if(B.has(x))hit++;}); return hit/Math.sqrt(A.size*B.size);
    }
    function daysSince(ts){return ts?Math.max(0,(Date.now()-ts)/86400000):999;}
    function scoreCandidate(game,query,history,maxPlays){
      const played=Object.values(history), total=played.reduce((n,x)=>n+(x.plays||0),0), qSim=query?overlap(game.title,query):0;
      const weights={}; played.forEach(item=>{const w=Math.sqrt(item.plays||0); (item.tokens||tokens(item.title)).forEach(t=>weights[t]=(weights[t]||0)+w);});
      const gameTokens=tokens(game.title); let affinityRaw=0; gameTokens.forEach(t=>affinityRaw+=weights[t]||0);
      const maxWeight=Math.max(1,...Object.values(weights));
      const taste=total?Math.min(1,affinityRaw/(maxWeight*Math.max(1,gameTokens.length))):0;
      let recentRaw=0; played.forEach(item=>{const sim=overlap(game.title,item.title); if(sim>0)recentRaw+=sim*(item.plays||0)*Math.exp(-daysSince(item.lastPlayed)/14);});
      const recent=total?Math.min(1,recentRaw/Math.max(1,total)):0;
      const plays=history[game.key]?.plays||0;
      const popularity=maxPlays?Math.log1p(plays)/Math.log1p(maxPlays):0;
      const exploration=1/Math.sqrt(1+plays);
      if(!played.length)return qSim*.60+exploration*.25+popularity*.15;
      return taste*.38+qSim*.25+recent*.22+popularity*.10+exploration*.05;
    }

    let offset=0, items=[];
    function ensureArrow(){
      const header=recSection.querySelector('.search-recommendations-header'); if(!header)return;
      if(document.getElementById('recommendationNext'))return;
      const next=document.createElement('button'); next.type='button'; next.id='recommendationNext'; next.className='recommendation-arrow'; next.setAttribute('aria-label','Show more recommendations'); next.innerHTML='<span aria-hidden="true">→</span>';
      header.appendChild(next);
      next.addEventListener('click',()=>{offset=Math.min(Math.max(0,items.length-visibleCount()),offset+visibleCount()); paint();});
    }
    function visibleCount(){return window.innerWidth<=570?2:(window.innerWidth<=900?3:4);}
    function paint(){
      const cards=[...recGrid.children], visible=visibleCount();
      cards.forEach((card,i)=>card.classList.toggle('is-shifted',i<offset));
      const next=document.getElementById('recommendationNext');
      if(next){next.disabled=offset>=Math.max(0,items.length-visible); next.classList.toggle('is-hidden',items.length<=visible);}
    }
    function renderPersonalized(query){
      const games=scrape();
      if(!query||!games.length){recSection.classList.remove('is-visible');recGrid.innerHTML='';items=[];offset=0;return;}
      ensureArrow();
      const history=readHistory(), playedKeys=new Set(Object.keys(history));
      const top=new Set((typeof matched==='function'?matched(query):[]).slice(0,5).map(x=>gameKey(x)));
      const maxPlays=Math.max(1,...Object.values(history).map(x=>x.plays||0));
      items=games.filter(g=>!top.has(g.key)).map(g=>({...g,score:scoreCandidate(g,query,history,maxPlays),played:playedKeys.has(g.key)})).sort((a,b)=>b.score-a.score||a.title.localeCompare(b.title));
      recGrid.innerHTML=''; offset=0;
      items.slice(0,20).forEach(game=>{
        const button=document.createElement('button'); button.type='button'; button.className='search-recommendation';
        const img=document.createElement('img'); img.loading='lazy'; img.src=game.image; img.alt=game.title;
        const span=document.createElement('span'); span.textContent=game.title; button.append(img,span);
        button.addEventListener('click',()=>game.card.click()); recGrid.appendChild(button);
      });
      recSection.classList.add('is-visible'); paint();
    }

    document.addEventListener('click',event=>{
      const card=event.target.closest('#gameGrid > .game-card');
      if(card){const game=scrape().find(g=>g.card===card); if(game)recordGame(game);}
    },true);
    let last='';
    const refresh=()=>{const q=searchInput.value.trim(); if(q===last)return; last=q; renderPersonalized(q);};
    searchInput.addEventListener('input',()=>{last='';setTimeout(refresh,0);});
    searchInput.addEventListener('change',()=>{last='';refresh();});
    window.addEventListener('resize',()=>{if(items.length)paint();});
    new MutationObserver(()=>{if(searchInput.value.trim())renderPersonalized(searchInput.value.trim());}).observe(gameGridEl,{childList:true});
    refresh();
  })();

  </script>
