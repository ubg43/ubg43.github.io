<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Docs</title>
  <meta name="description" content="Play unblocked games online.">
  <link rel="shortcut icon" href="Docs.ico" type="image/ico">
  <style>
    :root{
      --blue:#0047bd;
      --blue-deep:#003a96;
      --ink:#142039;
      --muted:#75829a;
      --panel:#ffffff;
      --line:rgba(16,34,70,.10);

    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(67, 131, 255, .22), transparent 28%),
        radial-gradient(circle at 82% 24%, rgba(139, 92, 246, .18), transparent 26%),
        radial-gradient(circle at 50% 88%, rgba(20, 184, 166, .13), transparent 30%),

    }
    button,input{font:inherit}
    .site-header{
      position:sticky;
      top:0;
      z-index:1000;
      width:100%;
      background:var(--blue);
      box-shadow:0 4px 18px rgba(0,24,80,.24);
    }
    .header-inner{
      width:min(1440px,100%);
      min-height:74px;
      margin:0 auto;
      padding:11px 20px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .search-shell{position:relative;flex:0 1 330px;width:330px;max-width:330px;z-index:1005}
    #searchBar{
      width:100%;
      height:44px;
      padding:0 42px 0 43px;
      border:1px solid rgba(255,255,255,.82);
      border-radius:13px;
      outline:none;
      background:#fff;
      color:var(--ink);
      font-size:15px;
      font-weight:600;
      box-shadow:0 7px 19px rgba(0,34,102,.20),inset 0 1px 0 #fff;
      transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
    }
    #searchBar::placeholder{color:#78849a;font-weight:500}
    #searchBar::-webkit-search-cancel-button{appearance:none;-webkit-appearance:none;display:none}
    #searchBar::-webkit-search-decoration{appearance:none;-webkit-appearance:none}
    #searchBar:focus{transform:translateY(-1px);border-color:#fff;box-shadow:0 10px 25px rgba(0,25,88,.26),0 0 0 4px rgba(255,255,255,.16)}
    .search-icon{position:absolute;left:15px;top:50%;width:16px;height:16px;transform:translateY(-58%);border:2px solid #6c7890;border-radius:50%;pointer-events:none}
    .search-shell:focus-within .search-icon{opacity:1;visibility:visible}
    .search-icon:after{content:"";position:absolute;right:-5px;bottom:-2px;width:7px;height:2px;border-radius:2px;background:#6c7890;transform:rotate(45deg);transform-origin:left center}
    .search-clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);display:none;width:30px;height:30px;padding:0;border:0;border-radius:8px;background:transparent;color:#69758a;cursor:pointer;font-size:19px;font-weight:800;line-height:1;z-index:2;transition:transform .15s ease,background .15s ease;align-items:center;justify-content:center;text-align:center}
    .search-clear:hover{background:#eef2f8;color:#32415c;transform:translateY(-50%) scale(1.04)}
    .search-clear:active{transform:translateY(-50%) scale(.96)}
    .search-results{position:absolute;left:0;top:calc(100% + 8px);display:none;width:100%;padding:6px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.99);box-shadow:0 18px 42px rgba(5,24,63,.28);overflow:hidden}
    .search-results.is-open{display:block;animation:dropIn .16s ease-out}
    @keyframes dropIn{from{opacity:0;transform:translateY(-5px) scale(.985)}to{opacity:1;transform:none}}
    .search-result{width:100%;min-height:58px;padding:7px 8px;display:flex;align-items:center;gap:11px;border:0;border-radius:10px;background:transparent;color:var(--ink);text-align:left;cursor:pointer;transition:background .14s ease,transform .14s ease}
    .search-result:hover,.search-result.is-active{background:#f1f5fc;transform:scale(1.012)}
    .search-result img{width:44px;height:44px;flex:0 0 44px;object-fit:cover;border-radius:9px;background:#e9eef7;box-shadow:0 2px 8px rgba(0,0,0,.13)}
    .search-result-copy{min-width:0}.search-result-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:800;line-height:1.25}.search-result-label{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:650}
    .search-empty{padding:14px 10px;color:var(--muted);font-size:13px;text-align:center}
    .header-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
    .header-action{width:148px;height:38px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;border:1px solid rgba(255,255,255,.28);border-radius:10px;background:rgba(3,52,146,.84);color:#fff;font-size:13px;font-weight:750;cursor:pointer;white-space:nowrap;box-shadow:0 5px 14px rgba(0,30,100,.20),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .16s ease,background .16s ease,box-shadow .16s ease}
    .header-action:hover{transform:translateY(-2px);background:#063a92;border-color:rgba(255,255,255,.40);box-shadow:0 8px 18px rgba(0,20,75,.23),inset 0 1px 0 rgba(255,255,255,.18)}
    .header-action:active{transform:translateY(0);box-shadow:0 3px 8px rgba(0,20,75,.18)}
    .action-icon{font-size:15px;line-height:1}
    .page-wrap{width:min(1440px,100%);margin:0 auto}
    .loading-card,.error-card{margin:24px 22px;padding:22px;border-radius:14px;background:rgba(255,255,255,.96);box-shadow:var(--shadow);text-align:center;color:var(--muted)}
    .game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:17px;padding:22px}
    .game-card{position:relative;background:rgba(255,255,255,.98);border-radius:15px;overflow:hidden;box-shadow:0 5px 16px rgba(0,0,0,.12);cursor:pointer;transition:transform .20s cubic-bezier(.2,.8,.2,1),box-shadow .20s ease,filter .20s ease}
    .game-card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:15px;border:1px solid rgba(255,255,255,.55);opacity:0;transition:opacity .18s ease}
    .game-card:hover{transform:translateY(-6px) scale(1.025);box-shadow:0 17px 34px rgba(3,20,55,.27);filter:saturate(1.02)}
    .game-card:hover::after{opacity:1}
    .game-card:active{transform:translateY(-2px) scale(.995);box-shadow:0 9px 20px rgba(3,20,55,.22)}
    .game-card img{display:block;width:100%;height:140px;object-fit:cover;transition:transform .24s cubic-bezier(.2,.8,.2,1),filter .24s ease}
    .game-card:hover img{transform:scale(1.045);filter:saturate(1.08) contrast(1.015)}
    .game-card h3{margin:10px 10px 12px;color:#172039;font-size:15px;line-height:1.3;text-align:center}
    .search-recommendations{display:none;padding:2px 22px 30px}
    .search-recommendations.is-visible{display:block;animation:recommendIn .20s ease-out}
    @keyframes recommendIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    .search-recommendations-header{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:5px 0 12px}
    .search-recommendations-title{margin:0;color:#fff;font-size:20px;line-height:1.2;font-weight:850;text-shadow:0 2px 5px rgba(0,0,0,.25)}
    .search-recommendations-subtitle{margin:0;color:rgba(255,255,255,.72);font-size:12px;font-weight:650}
    .search-recommendations-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:13px}
    .search-recommendation{appearance:none;width:100%;padding:0;overflow:hidden;border:0;border-radius:13px;background:#fff;text-align:left;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.12);transition:transform .18s ease,box-shadow .18s ease}
    .search-recommendation:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 13px 24px rgba(0,0,0,.20)}
    .search-recommendation img{display:block;width:100%;height:112px;object-fit:cover}
    .search-recommendation span{display:block;padding:9px 10px 11px;color:#1b2740;font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    footer{background:var(--blue);color:#fff;text-align:center;padding:20px;font-size:14px}
    footer p{margin:4px 0}.footer-muted{opacity:.82}
    @media(max-width:1050px){.search-shell{flex-basis:280px;width:280px;max-width:280px}.header-action{width:138px}}
    @media(max-width:830px){.header-inner{flex-wrap:wrap;padding:11px 14px}.search-shell{order:1;flex:1 1 100%;width:100%;max-width:none}.header-actions{order:2;flex:1 1 auto}.header-action{width:148px;min-width:0}}
    @media(max-width:570px){.header-actions{width:100%;display:grid;grid-template-columns:1fr 1fr}.header-action{width:100%}.game-grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px;gap:12px}.search-recommendations{padding-left:14px;padding-right:14px}.search-recommendations-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.search-recommendation img{height:92px}.game-card img{height:112px}}
  
    .category-toggle{margin-left:auto;height:38px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;border:1px solid rgba(255,255,255,.28);border-radius:10px;background:rgba(3,52,146,.84);color:#fff;font-size:13px;font-weight:750;cursor:pointer;white-space:nowrap;box-shadow:0 5px 14px rgba(0,30,100,.20),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .16s ease,background .16s ease,box-shadow .16s ease}
    .category-toggle:hover{transform:translateY(-2px);background:#063a92;border-color:rgba(255,255,255,.40);box-shadow:0 8px 18px rgba(0,20,75,.23),inset 0 1px 0 rgba(255,255,255,.18)}
    .category-toggle:active{transform:translateY(0);box-shadow:0 3px 8px rgba(0,20,75,.18)}
    .category-toggle-icon{font-size:15px;line-height:1}
    .category-overlay{position:fixed;inset:0;background:rgba(1,9,28,.48);backdrop-filter:blur(2px);z-index:1090;opacity:0;transition:opacity .2s ease}
    .category-overlay.is-open{opacity:1}
    .category-sidebar{position:fixed;top:0;right:0;height:100vh;width:min(350px,88vw);background:linear-gradient(180deg,#05142f 0%,#092047 100%);color:#fff;z-index:1100;box-shadow:-18px 0 42px rgba(0,10,35,.35);transform:translateX(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
    .category-sidebar.is-open{transform:none}
    .category-sidebar-header{padding:24px 20px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;border-bottom:1px solid rgba(255,255,255,.1)}
    .category-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:rgba(255,255,255,.55);font-weight:800;margin-bottom:4px}
    .category-sidebar-header h2{margin:0;font-size:22px;line-height:1.2;font-weight:850}
    .category-close{width:34px;height:34px;padding:0;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.06);color:#fff;font-size:25px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center;transition:background .15s ease,transform .15s ease}
    .category-close:hover{background:rgba(255,255,255,.12);transform:scale(1.05)}
    .category-list{padding:14px 12px 20px;overflow:auto}
    .category-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 13px;margin:4px 0;border:1px solid transparent;border-radius:12px;background:transparent;color:#fff;text-align:left;cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .15s ease}
    .category-item:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.09);transform:translateX(-2px)}
    .category-item.is-active{background:rgba(37,115,255,.24);border-color:rgba(76,146,255,.34)}
    .category-item-main{display:flex;align-items:center;gap:10px;min-width:0}
    .category-dot{width:9px;height:9px;border-radius:50%;background:#4d91ff;box-shadow:0 0 0 4px rgba(77,145,255,.12);flex:0 0 auto}
    .category-name{font-size:14px;font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .category-count{min-width:30px;height:24px;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.76);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}

    .category-item.is-trending .category-dot{background:#5a9bff;box-shadow:0 0 0 4px rgba(90,155,255,.14),0 0 12px rgba(90,155,255,.18)}
    .category-item.is-trending.is-active{background:rgba(28,94,205,.29);border-color:rgba(83,148,255,.42)}
    .header-action:focus-visible,.category-toggle:focus-visible,.category-close:focus-visible,.category-item:focus-visible,.recommendation-arrow:focus-visible,.search-clear:focus-visible,.search-result:focus-visible,.search-recommendation:focus-visible{outline:2px solid rgba(255,255,255,.92);outline-offset:2px}
    .search-recommendation{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease,filter .18s ease}
    .search-recommendation:hover{filter:saturate(1.03);}
    .search-recommendation:active{transform:translateY(-1px) scale(.995);}
    .recommendation-arrow{backdrop-filter:blur(6px);}
    body.category-locked{overflow:hidden}
    @media(max-width:830px){.category-toggle-label{display:none}.category-toggle{width:42px;padding:0;margin-left:auto}.header-actions{margin-left:0}}
    @media(max-width:570px){.category-toggle{width:42px;height:38px;margin-left:auto}.header-actions{margin-left:0}}
</style>

<style id="personalized-recommendation-style">
  .search-recommendations-header{align-items:center;position:relative}
  .recommendation-controls{display:flex;align-items:center;gap:7px}
  .recommendation-arrow{width:34px;height:34px;flex:0 0 34px;border:1px solid rgba(255,255,255,.34);border-radius:10px;background:rgba(0,54,150,.84);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;line-height:1;box-shadow:0 5px 15px rgba(0,15,55,.2);transition:transform .16s ease,background .16s ease,box-shadow .16s ease,opacity .16s ease}
  .recommendation-arrow:hover:not(:disabled){transform:translateY(-1px) scale(1.05);background:rgba(0,64,170,.95);box-shadow:0 8px 19px rgba(0,15,55,.28)}
  .recommendation-arrow:active:not(:disabled){transform:scale(.96)}
  .recommendation-arrow:disabled{opacity:.35;cursor:default}
  .recommendation-track{display:grid!important;grid-template-rows:repeat(2,minmax(0,1fr));grid-auto-flow:column;grid-auto-columns:calc((100% - 39px)/4);grid-template-columns:none!important;gap:13px;overflow-x:auto;overflow-y:hidden;width:100%;scroll-behavior:smooth;scrollbar-width:none;padding:2px 2px 5px}
  .recommendation-track::-webkit-scrollbar{display:none}
  .recommendation-track .search-recommendation{width:100%;min-width:0;height:100%}
  @media(max-width:900px){.recommendation-track{grid-auto-columns:calc((100% - 26px)/3)}.recommendation-arrow{width:32px;height:32px;flex-basis:32px}}
  @media(max-width:570px){.recommendation-track{grid-auto-columns:calc((100% - 13px)/2)}.recommendation-arrow{width:31px;height:31px;flex-basis:31px}}
</style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="search-shell" role="search">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="searchBar" type="search" placeholder="Search games..." autocomplete="off" spellcheck="false" aria-label="Search games" aria-controls="searchResults" aria-expanded="false">
        <button id="searchClear" class="search-clear" type="button" aria-label="Clear search">×</button>
        <div id="searchResults" class="search-results" role="listbox" aria-label="Game suggestions"></div>
      </div>
      <nav class="header-actions" aria-label="Game actions">
        <button class="header-action" id="randomGameButton" type="button"><span class="action-icon" aria-hidden="true">🎲</span><span>Random Game</span></button>
        <button class="header-action" id="reportGameButton" type="button"><span class="action-icon" aria-hidden="true">📝</span><span>Report / Suggest</span></button>
      </nav>
      <button class="category-toggle" id="categoryToggle" type="button" aria-label="Open game categories" aria-controls="categorySidebar" aria-expanded="false">
        <span class="category-toggle-icon" aria-hidden="true">☰</span>
        <span class="category-toggle-label">Categories</span>
      </button>
    </div>
  </header>

  <div class="category-overlay" id="categoryOverlay" hidden></div>
  <aside class="category-sidebar" id="categorySidebar" aria-label="Game categories" aria-hidden="true">
    <div class="category-sidebar-header">
      <div>
        <div class="category-kicker">Browse</div>
        <h2>Game Categories</h2>
      </div>
      <button class="category-close" id="categoryClose" type="button" aria-label="Close categories">×</button>
    </div>
    <div class="category-list" id="categoryList"></div>
  </aside>

  <main class="page-wrap">
    <div id="loadingCard" class="loading-card">Loading games...</div>
    <div class="game-grid" id="gameGrid">
      <!-- Add new game cards here. Search and Random Game discover them automatically. -->
    </div>
    <section id="searchRecommendations" class="search-recommendations" aria-live="polite">
      <div class="search-recommendations-header">
        <h2 class="search-recommendations-title">You may also like</h2>
        <p class="search-recommendations-subtitle">More games to try</p>
      </div>
      <div class="search-recommendations-grid" id="searchRecommendationsGrid"></div>
    </section>
  </main>

  <footer>
    <p class="footer-muted">© 2026 All rights reserved.</p>
    <noscript><p><a href="legacy-index.html" style="color:#fff">Open the full game library</a></p></noscript>
  </footer>

  <script>
  function openGame(url){
    if(!url)return;
    const tab=window.open('about:blank','_blank');
    if(!tab)return;
    const safe=String(url).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    tab.document.write('<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Docs</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{width:100%;height:100%;border:0}</style></head><body><iframe src="'+safe+'" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"></iframe></body></html>');
    tab.document.close();
  }

  const searchBar=document.getElementById('searchBar');
  const searchResults=document.getElementById('searchResults');
  const searchClear=document.getElementById('searchClear');
  const gameGrid=document.getElementById('gameGrid');
  const loadingCard=document.getElementById('loadingCard');
  const recWrap=document.getElementById('searchRecommendations');
  const recGrid=document.getElementById('searchRecommendationsGrid');
  const randomButton=document.getElementById('randomGameButton');
  const reportButton=document.getElementById('reportGameButton');

  const normalize=s=>(s||'').toString().trim().toLowerCase();
  function scrapeGames(){
    return Array.from(gameGrid.querySelectorAll(':scope > .game-card')).map((card,index)=>({
      card,index,
      title:(card.querySelector('h3')?.textContent||card.querySelector('img')?.alt||'Game').trim(),
      image:card.querySelector('img')?.currentSrc||card.querySelector('img')?.src||''
    })).filter(g=>g.title);
  }
  function rank(title,query){
    const t=normalize(title),q=normalize(query),words=t.split(/\s+/),queryWords=q.split(/\s+/).filter(Boolean);
    if(!q)return 99;
    if(t===q)return 0;
    if(t.startsWith(q))return 1;
    if(words.some(w=>w.startsWith(q)))return 2;
    const overlap=queryWords.filter(x=>words.some(w=>w.includes(x))).length;
    if(overlap===queryWords.length&&overlap)return 2.5;
    if(t.includes(q))return 3;
    return 99;
  }
  function matched(query){
    return scrapeGames().map(g=>({...g,score:rank(g.title,query)})).filter(g=>g.score<99).sort((a,b)=>a.score-b.score||a.title.localeCompare(b.title));
  }

  function closeSearch(){searchResults.classList.remove('is-open');searchBar.setAttribute('aria-expanded','false');}
  function openSearch(){searchResults.classList.add('is-open');searchBar.setAttribute('aria-expanded','true');}

  function renderSuggestions(query){
    searchResults.innerHTML='';
    if(!query){closeSearch();return;}
    const top=matched(query).slice(0,5);
    if(!top.length){
      searchResults.innerHTML='<div class="search-empty">No matching games yet</div>';
      openSearch();
      return;
    }
    top.forEach((game,i)=>{
      const button=document.createElement('button');
      button.type='button';button.className='search-result';button.setAttribute('role','option');
      button.innerHTML='<img loading="lazy" alt=""><span class="search-result-copy"><span class="search-result-title"></span><span class="search-result-label">Play game</span></span>';
      const img=button.querySelector('img');img.src=game.image;img.alt=game.title;
      button.querySelector('.search-result-title').textContent=game.title;
      button.dataset.index=String(i);
      button.addEventListener('click',()=>{clickSound();closeSearch();searchBar.value=game.title;searchClear.style.display='flex';game.card.click();renderRecommendations(game.title);});
      searchResults.appendChild(button);
    });
    openSearch();
  }

  function renderRecommendations(query){}

  searchBar.addEventListener('input',()=>{
    const query=searchBar.value.trim();
    searchClear.style.display=query?'flex':'none';
    renderSuggestions(query);
    renderRecommendations(query);
    scrapeGames().forEach(g=>{g.card.style.display=!query||rank(g.title,query)<99?'':'none';});
  });
  searchBar.addEventListener('focus',()=>{if(searchBar.value.trim())renderSuggestions(searchBar.value.trim());});
  searchBar.addEventListener('keydown',e=>{
    const items=[...searchResults.querySelectorAll('.search-result')];
    if(e.key==='ArrowDown'&&items.length){e.preventDefault();let i=items.findIndex(x=>x.classList.contains('is-active'));i=(i+1)%items.length;items.forEach((x,j)=>x.classList.toggle('is-active',j===i));}
    else if(e.key==='ArrowUp'&&items.length){e.preventDefault();let i=items.findIndex(x=>x.classList.contains('is-active'));i=i<=0?items.length-1:i-1;items.forEach((x,j)=>x.classList.toggle('is-active',j===i));}
    else if(e.key==='Enter'){const active=searchResults.querySelector('.search-result.is-active');if(active){e.preventDefault();active.click();}}
    else if(e.key==='Escape')closeSearch();
  });
  searchClear.addEventListener('click',()=>{clickSound();searchBar.value='';searchClear.style.display='none';scrapeGames().forEach(g=>g.card.style.display='');closeSearch();renderRecommendations('');searchBar.focus();});
  document.addEventListener('click',e=>{if(!e.target.closest('.search-shell'))closeSearch();});

  randomButton.addEventListener('click',()=>{
    const available=scrapeGames().filter(g=>g.card.style.display!=='none');
    const pool=available.length?available:scrapeGames();
    if(!pool.length)return;
    const game=pool[Math.floor(Math.random()*pool.length)];
    game.card.click();
  });
  reportButton.addEventListener('click',()=>{window.location.href='mailto:ubg423@gmail.com?subject=UBG%20Problem%20%2F%20Game%20Suggestion';});

  let audioContext=null;
  function clickSound(){
    try{
      audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();
      if(audioContext.state==='suspended')audioContext.resume();
      const now=audioContext.currentTime;
      const master=audioContext.createGain();
      master.gain.setValueAtTime(.0001,now);
      master.gain.exponentialRampToValueAtTime(.055,now+.008);
      master.gain.exponentialRampToValueAtTime(.0001,now+.13);
      master.connect(audioContext.destination);
      [[620,0,.08,'sine'],[880,.035,.095,'sine']].forEach(([freq,delay,duration,type])=>{
        const osc=audioContext.createOscillator();
        const gain=audioContext.createGain();
        osc.type=type;
        osc.frequency.setValueAtTime(freq,now+delay);
        osc.frequency.exponentialRampToValueAtTime(freq*1.045,now+delay+duration);
        gain.gain.setValueAtTime(.0001,now+delay);
        gain.gain.exponentialRampToValueAtTime(.72,now+delay+.006);
        gain.gain.exponentialRampToValueAtTime(.0001,now+delay+duration);
        osc.connect(gain);gain.connect(master);
        osc.start(now+delay);osc.stop(now+delay+duration+.01);
      });
    }catch(_){}
  }
  document.addEventListener('click',e=>{
    if(e.target.closest('.search-result,.search-recommendation'))return;
    if(e.target.closest('button,.game-card'))clickSound();
  },true);

  async function loadLegacyGames(){
    try{
      const custom=Array.from(gameGrid.children).filter(el=>el.classList.contains('game-card'));
      const response=await fetch('legacy-index.html',{cache:'no-store'});
      if(!response.ok)throw new Error('Legacy library unavailable');
      const text=await response.text();
      const doc=new DOMParser().parseFromString(text,'text/html');
      const legacy=doc.querySelector('#gameGrid');
      if(!legacy)throw new Error('Game library not found');
      const legacyCards=Array.from(legacy.querySelectorAll(':scope > .game-card'));
      gameGrid.innerHTML='';
      legacyCards.forEach(card=>gameGrid.appendChild(document.importNode(card,true)));
      custom.forEach(card=>gameGrid.appendChild(card));
      loadingCard.style.display='none';
    }catch(err){
      loadingCard.className='error-card';
      loadingCard.textContent='The game library could not be loaded right now. Refresh the page to try again.';
    }
  }

  loadLegacyGames();


  /* Automatic game categories */
  (function(){
    const toggle=document.getElementById('categoryToggle');
    const close=document.getElementById('categoryClose');
    const sidebar=document.getElementById('categorySidebar');
    const overlay=document.getElementById('categoryOverlay');
    const list=document.getElementById('categoryList');
    const grid=document.getElementById('gameGrid');
    if(!toggle||!close||!sidebar||!overlay||!list||!grid)return;

    const CATEGORY_RULES=[
      ['Action',['action','shooter','combat','battle','fight','war','zombie','ninja','stickman','assassin','gun','sniper','strike','rush']],
      ['Adventure',['adventure','quest','platform','dungeon','maze','escape','explore','survival','island','parkour']],
      ['Arcade',['arcade','flappy','runner','run','jump','brick','ball','bubble','match','pinball','snake']],
      ['Puzzle',['puzzle','logic','sudoku','2048','mahjong','word','memory','connect','block','brain','sort','merge']],
      ['Racing',['racing','race','drift','car','cars','motor','bike','bmx','kart','traffic','drive']],
      ['Sports',['football','soccer','basketball','baseball','golf','tennis','hockey','volleyball','bowling','pool','sports','skate','ski']],
      ['Strategy',['strategy','tower','defense','defence','battle','td','idle','tycoon','manager','kingdom','chess','checkers']],
      ['Simulation',['simulator','simulation','farming','farm','restaurant','cooking','shop','business','city','hotel','airport','life','house']],
      ['Multiplayer',['multiplayer','2 player','2p','io','agar','slither','online']],
      ['Casual',['clicker','idle','dress','makeup','color','drawing','quiz','trivia','fun','cute']]
    ];
    const categories=['All Games','Trending',...CATEGORY_RULES.map(x=>x[0])];
    let active='All Games';

    const TRENDING_LOG_KEY='ubg_trending_play_log_v1';
    const TRENDING_CACHE_KEY='ubg_trending_cache_v1';
    const THREE_DAYS=3*24*60*60*1000;
    const MAX_TRENDING=25;
    const normalize=s=>(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
    const gameKey=(title,image='')=>normalize(title)+'|'+image;
    function readJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback));}catch(_){return fallback;}}
    function writeJSON(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch(_){} }
    function pruneTrendLog(log){
      const cutoff=Date.now()-90*24*60*60*1000;
      Object.keys(log).forEach(k=>{log[k]=(log[k]||[]).filter(ts=>Number(ts)>=cutoff).slice(-80);if(!log[k].length)delete log[k];});
      return log;
    }
    function recordTrendingPlay(game){
      if(!game||!game.title)return;
      const log=pruneTrendLog(readJSON(TRENDING_LOG_KEY,{}));
      const key=gameKey(game.title,game.image);
      log[key]=log[key]||[];
      log[key].push(Date.now());
      writeJSON(TRENDING_LOG_KEY,pruneTrendLog(log));
    }
    function trendingKeys(){
      const slot=Math.floor(Date.now()/THREE_DAYS);
      const cached=readJSON(TRENDING_CACHE_KEY,{});
      if(cached.slot===slot&&Array.isArray(cached.keys))return new Set(cached.keys.slice(0,MAX_TRENDING));
      const gs=games();
      const log=pruneTrendLog(readJSON(TRENDING_LOG_KEY,{}));
      writeJSON(TRENDING_LOG_KEY,log);
      const cutoff=Date.now()-THREE_DAYS;
      const ranked=gs.map(g=>{
        const key=gameKey(g.title,g.card.querySelector('img')?.currentSrc||g.card.querySelector('img')?.src||'');
        const hits=(log[key]||[]).filter(ts=>Number(ts)>=cutoff);
        return {g,n:hits.length,last:Math.max(0,...hits)};
      }).filter(x=>x.n>0);
      ranked.sort((a,b)=>b.n-a.n||b.last-a.last||a.g.title.localeCompare(b.g.title));
      const keys=ranked.slice(0,MAX_TRENDING).map(x=>gameKey(x.g.title,x.g.card.querySelector('img')?.currentSrc||x.g.card.querySelector('img')?.src||''));
      writeJSON(TRENDING_CACHE_KEY,{slot,keys});
      return new Set(keys);
    }
    function openSidebar(){sidebar.classList.add('is-open');overlay.hidden=false;requestAnimationFrame(()=>overlay.classList.add('is-open'));sidebar.setAttribute('aria-hidden','false');toggle.setAttribute('aria-expanded','true');document.body.classList.add('category-locked');render();}
    function closeSidebar(){sidebar.classList.remove('is-open');overlay.classList.remove('is-open');sidebar.setAttribute('aria-hidden','true');toggle.setAttribute('aria-expanded','false');document.body.classList.remove('category-locked');setTimeout(()=>{if(!sidebar.classList.contains('is-open'))overlay.hidden=true;},220);}
    function render(){
      const gs=games();
      const trend=trendingKeys();
      const counts=Object.fromEntries(categories.map(c=>[c,0]));
      gs.forEach(g=>{counts[categoryFor(g.title)]++;});
      counts.Trending=trend.size;
      list.innerHTML='';
      categories.forEach(c=>{
        const btn=document.createElement('button');btn.type='button';btn.className='category-item'+(active===c?' is-active':'')+(c==='Trending'?' is-trending':'');
        btn.innerHTML='<span class="category-item-main"><span class="category-dot" aria-hidden="true"></span><span class="category-name"></span></span><span class="category-count"></span>';
        btn.querySelector('.category-name').textContent=c;
        btn.querySelector('.category-count').textContent=String(c==='All Games'?gs.length:counts[c]);
        btn.addEventListener('click',()=>{
          active=c;
          const nowTrend=trendingKeys();
          gs.forEach(g=>{
            const key=gameKey(g.title,g.card.querySelector('img')?.currentSrc||g.card.querySelector('img')?.src||'');
            const match=c==='All Games'||(c==='Trending'?nowTrend.has(key):categoryFor(g.title)===c);
            g.card.style.display=match?'':'none';
          });
          list.querySelectorAll('.category-item').forEach(x=>x.classList.remove('is-active'));btn.classList.add('is-active');
        });
        list.appendChild(btn);
      });
    }
    document.addEventListener('click',event=>{
      const card=event.target.closest('#gameGrid > .game-card');
      if(card){
        const img=card.querySelector('img');
        recordTrendingPlay({title:(card.querySelector('h3')?.textContent||img?.alt||'Game').trim(),image:img?.currentSrc||img?.src||''});
      }
    },true);
    window.addEventListener('storage',event=>{if(event.key===TRENDING_CACHE_KEY||event.key===TRENDING_LOG_KEY)render();});

    toggle.addEventListener('click',()=>sidebar.classList.contains('is-open')?closeSidebar():openSidebar());
    close.addEventListener('click',closeSidebar);overlay.addEventListener('click',closeSidebar);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sidebar.classList.contains('is-open'))closeSidebar();});
    new MutationObserver(()=>{render();}).observe(grid,{childList:true});
    render();
  })();

  /* Personalized recommendation carousel */
  (function(){
    const recSection=document.getElementById('searchRecommendations');
    const recGrid=document.getElementById('searchRecommendationsGrid');
    const gameGridEl=document.getElementById('gameGrid');
    const searchInput=document.getElementById('searchBar');
    const recHeader=recSection?.querySelector('.search-recommendations-header');
    if(!recSection||!recGrid||!gameGridEl||!searchInput||!recHeader)return;

    const PLAY_KEY='ubg_play_history_v3';
    const SEARCH_KEY='ubg_search_history_v2';
    const MAX_ITEMS=32;
    const STOP=new Set(['the','and','for','with','game','games','play','new','online','3d','io','html','html5','a','of','to','in','on','my','free']);
    const norm=s=>(s||'').toString().toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
    const tokens=s=>norm(s).split(' ').filter(x=>x.length>1&&!STOP.has(x));
    const key=g=>norm(g.title)+'|'+(g.image||'');
    const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))||f}catch(_){return f}};
    const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}};
    function games(){return Array.from(gameGridEl.querySelectorAll(':scope > .game-card')).map(card=>{const img=card.querySelector('img');return {card,title:(card.querySelector('h3')?.textContent||img?.alt||'Game').trim(),image:img?.currentSrc||img?.src||''}}).filter(g=>g.title).map(g=>({...g,key:key(g)}));}
    function similarity(a,b){const A=new Set(tokens(a)),B=new Set(tokens(b));if(!A.size||!B.size)return 0;let hit=0;A.forEach(t=>{if(B.has(t))hit++});return hit/Math.sqrt(A.size*B.size);}
    function recordSearch(q){q=norm(q);if(!q)return;const h=read(SEARCH_KEY,{});const x=h[q]||{count:0,last:0};x.count++;x.last=Date.now();h[q]=x;const ordered=Object.entries(h).sort((a,b)=>(b[1].last||0)-(a[1].last||0)).slice(0,80);write(SEARCH_KEY,Object.fromEntries(ordered));}
    function recordPlay(g){if(!g?.title)return;const h=read(PLAY_KEY,{});const x=h[g.key]||{title:g.title,image:g.image,plays:0,lastPlayed:0};x.title=g.title;x.image=g.image;x.plays++;x.lastPlayed=Date.now();h[g.key]=x;const ordered=Object.entries(h).sort((a,b)=>(b[1].lastPlayed||0)-(a[1].lastPlayed||0)).slice(0,120);write(PLAY_KEY,Object.fromEntries(ordered));}

    let page=0;
    function cols(){return window.innerWidth<=570?2:window.innerWidth<=900?3:4;}
    function pageSize(){return cols()*2;}
    function pages(){return Math.max(1,Math.ceil(currentItems.length/pageSize()));}
    let currentItems=[];

    function ensureControls(){
      if(recHeader.querySelector('.recommendation-controls'))return;
      const controls=document.createElement('div');controls.className='recommendation-controls';
      const prev=document.createElement('button');prev.type='button';prev.className='recommendation-arrow';prev.setAttribute('aria-label','Previous recommendations');prev.textContent='←';
      const next=document.createElement('button');next.type='button';next.className='recommendation-arrow';next.setAttribute('aria-label','Next recommendations');next.textContent='→';
      controls.append(prev,next);recHeader.appendChild(controls);
      prev.addEventListener('click',()=>go(page-1));next.addEventListener('click',()=>go(page+1));
    }
    function updateControls(){
      const controls=recHeader.querySelector('.recommendation-controls');
      if(!controls)return;
      const prev=controls.children[0],next=controls.children[1];
      const total=pages();
      prev.disabled=page<=0;next.disabled=page>=total-1;
      controls.hidden=currentItems.length<=pageSize();
    }
    function go(target){page=Math.max(0,Math.min(pages()-1,target));recGrid.scrollTo({left:page*recGrid.clientWidth,behavior:'smooth'});updateControls();}

    function recommendationScore(g,query,plays,searches){
      const q=norm(query);
      const querySim=similarity(g.title,q);
      let playAffinity=0,recentAffinity=0;
      const pv=Object.values(plays);
      const totalPlays=pv.reduce((n,x)=>n+(x.plays||0),0);
      if(totalPlays){
        let weighted=0,recent=0;
        pv.forEach(item=>{
          const sim=similarity(g.title,item.title);
          if(!sim)return;
          const p=Math.max(1,item.plays||1);
          weighted+=sim*Math.sqrt(p);
          const age=Math.max(0,(Date.now()-(item.lastPlayed||0))/86400000);
          recent+=sim*p*Math.exp(-age/14);
        });
        playAffinity=Math.min(1,weighted/Math.sqrt(totalPlays));
        recentAffinity=Math.min(1,recent/Math.max(1,totalPlays));
      }
      let searchAffinity=0;
      const sv=Object.values(searches);
      const totalSearches=sv.reduce((n,x)=>n+(x.count||0),0);
      if(totalSearches){
        let weighted=0;
        sv.forEach(item=>weighted+=similarity(g.title,item.query||'')*(item.count||0));
        searchAffinity=Math.min(1,weighted/totalSearches);
      }
      const already=plays[g.key]?.plays||0;
      const freshness=already?1/Math.sqrt(already+1):1;
      // Search intent gets priority, then durable play taste and recent play taste.
      return querySim*.30 + searchAffinity*.25 + playAffinity*.25 + recentAffinity*.15 + freshness*.05;
    }

    function render(query){
      const gs=games();
      recGrid.classList.add('recommendation-track');
      if(!query||!gs.length){recSection.classList.remove('is-visible');recGrid.classList.remove('recommendation-track');recGrid.innerHTML='';currentItems=[];page=0;updateControls();return;}
      ensureControls();
      const plays=read(PLAY_KEY,{}),searches=read(SEARCH_KEY,{});
      const exact=typeof matched==='function'?matched(query):[];
      const exactKeys=new Set(exact.slice(0,8).map(g=>key(g)));
      currentItems=gs.map(g=>({...g,score:recommendationScore(g,query,plays,searches)}))
        .filter(g=>!exactKeys.has(g.key))
        .sort((a,b)=>b.score-a.score||a.title.localeCompare(b.title))
        .slice(0,MAX_ITEMS);
      // When a broad query would otherwise leave too little, add best non-exact candidates.
      if(currentItems.length<Math.min(12,gs.length)){
        const extras=gs.map(g=>({...g,score:recommendationScore(g,query,plays,searches)})).filter(g=>!currentItems.some(x=>x.key===g.key)).sort((a,b)=>b.score-a.score||a.title.localeCompare(b.title));
        currentItems=currentItems.concat(extras).slice(0,MAX_ITEMS);
      }
      recGrid.innerHTML='';
      currentItems.forEach(game=>{
        const button=document.createElement('button');button.type='button';button.className='search-recommendation';button.title=game.title;
        const img=document.createElement('img');img.loading='lazy';img.src=game.image;img.alt=game.title;
        const span=document.createElement('span');span.textContent=game.title;button.append(img,span);
        button.addEventListener('click',()=>{clickSound();recordPlay(game);game.card.click();});
        recGrid.appendChild(button);
      });
      page=0;recGrid.scrollLeft=0;recSection.classList.add('is-visible');updateControls();
    }

    document.addEventListener('click',e=>{const card=e.target.closest('#gameGrid > .game-card');if(card){const game=games().find(g=>g.card===card);if(game)recordPlay(game);}},true);
    let lastQuery='',timer=0;
    const refresh=()=>{const q=searchInput.value.trim();if(q===lastQuery){updateControls();return;}lastQuery=q;if(q.length>=2)recordSearch(q);render(q);};
    searchInput.addEventListener('input',()=>{lastQuery='';clearTimeout(timer);timer=setTimeout(refresh,280);});
    searchInput.addEventListener('change',refresh);
    let resizeTimer=0;
    window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{page=0;recGrid.scrollLeft=0;updateControls();},120);});
    new MutationObserver(()=>{if(searchInput.value.trim())render(searchInput.value.trim());}).observe(gameGridEl,{childList:true});
    setTimeout(refresh,150);
  })();

  </script>
