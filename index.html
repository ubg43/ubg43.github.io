<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Google Docs</title>
<link rel="shortcut icon" href="Docs.ico" type="image/ico">
<style>
:root{--blue:#064acb;--deep:#06142f;--text:#17213a;--muted:#71809a;--line:#dfe7f3;--card:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:radial-gradient(circle at 18% 10%,#2f66d927,transparent 27%),radial-gradient(circle at 82% 16%,#8b5cf620,transparent 25%),linear-gradient(135deg,#06142f,#0b2554 48%,#101a38);min-height:100vh}button,input{font:inherit}.site-header{position:sticky;top:0;z-index:50;background:var(--blue);box-shadow:0 6px 24px #001b5a55}.header-inner{max-width:1500px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.search-shell{position:relative;flex:1 1 330px;max-width:440px}.search-shell input{width:100%;height:44px;padding:0 42px;border:0;border-radius:13px;outline:0;background:#fff;color:var(--text);font-weight:650;box-shadow:0 8px 22px #001b5a33}.search-icon{position:absolute;left:15px;top:50%;width:16px;height:16px;border:2px solid #72809a;border-radius:50%;transform:translateY(-58%);pointer-events:none}.search-icon:after{content:"";position:absolute;right:-5px;bottom:-2px;width:7px;height:2px;background:#72809a;transform:rotate(45deg);border-radius:2px}.search-clear{position:absolute;right:7px;top:7px;width:30px;height:30px;border:0;background:transparent;color:#67758c;border-radius:8px;display:none;cursor:pointer;font-size:20px}.header-actions{display:flex;gap:8px;margin-left:auto}.action,.cat-btn{height:38px;padding:0 13px;border:1px solid #ffffff38;border-radius:10px;background:#003b9c;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 5px 15px #001f7233}.action:hover,.cat-btn:hover{transform:translateY(-1px);background:#07358e}.page{max-width:1500px;margin:auto}.hero{padding:24px 20px 8px;color:#fff}.hero h1{font-size:28px;margin:0 0 5px}.hero p{margin:0;color:#ffffffad}.featured{padding:12px 20px 4px}.featured h2{color:#fff;font-size:20px;margin:0 0 10px}.strip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px;overflow:auto;padding-bottom:6px}.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:16px;padding:20px}.game-card{position:relative;background:var(--card);border-radius:15px;overflow:hidden;box-shadow:0 6px 16px #00132d22;cursor:pointer;transition:.18s}.game-card:hover{transform:translateY(-5px);box-shadow:0 16px 30px #00132d44}.game-card img{display:block;width:100%;height:138px;object-fit:cover;background:#dfe6f0}.game-card h3{margin:10px 10px 13px;text-align:center;font-size:14px;line-height:1.25}.featured .game-card img{height:92px}.featured .game-card h3{font-size:12px;margin:8px}.card-ribbons{position:absolute;left:0;top:9px;z-index:2;display:flex;flex-direction:column;gap:6px;pointer-events:none}.ribbon{padding:6px 14px 6px 10px;font:900 10px/1 Arial,sans-serif;letter-spacing:.08em;clip-path:polygon(0 0,100% 0,88% 50%,100% 100%,0 100%);box-shadow:3px 4px 9px #0003}.ribbon.new{background:#e52525;color:#ffe600}.ribbon.trending{background:#ffe600;color:#c51f1f}.results{position:absolute;left:0;right:0;top:52px;display:none;background:#fff;border-radius:13px;padding:6px;box-shadow:0 18px 36px #00132d3d;z-index:80}.results.open{display:block}.result{display:flex;align-items:center;gap:9px;width:100%;padding:7px;border:0;background:transparent;border-radius:9px;text-align:left;cursor:pointer}.result:hover{background:#f1f5fb}.result img{width:40px;height:40px;object-fit:cover;border-radius:8px}.sidebar{position:fixed;right:0;top:0;width:min(360px,90vw);height:100vh;background:linear-gradient(#061534,#0a2451);color:#fff;z-index:100;transform:translateX(102%);transition:.22s;box-shadow:-16px 0 40px #0005;padding:22px 14px;overflow:auto}.sidebar.open{transform:none}.overlay{position:fixed;inset:0;background:#0007;z-index:90}.hidden{display:none!important}.cat-list{display:grid;gap:6px;margin-top:16px}.cat{display:flex;justify-content:space-between;padding:11px 12px;border:1px solid #ffffff16;border-radius:10px;background:#ffffff0b;color:#fff;cursor:pointer}.cat:hover,.cat.active{background:#256dff3d}.status{padding:8px 20px;color:#ffffffaa;font-size:12px}.empty{color:#fff;padding:30px 20px;text-align:center}footer{padding:24px 20px;background:var(--blue);color:#fff;text-align:center;margin-top:24px}@media(max-width:900px){.strip{grid-template-columns:repeat(5,minmax(130px,1fr))}}@media(max-width:600px){.header-actions{width:100%;margin-left:0}.action,.cat-btn{flex:1}.game-grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px;gap:12px}.game-card img{height:112px}.hero{padding:18px 14px 6px}.featured{padding:12px 14px 4px}.strip{grid-template-columns:repeat(3,minmax(115px,1fr))}}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner">
<div class="search-shell"><span class="search-icon"></span><input id="searchBar" type="search" placeholder="Search games..." autocomplete="off"><button id="searchClear" class="search-clear" aria-label="Clear">×</button><div id="searchResults" class="results"></div></div>
<div class="header-actions"><button id="randomGameButton" class="action">🎲 Random Game</button><button id="reportGameButton" class="action">📝 Report / Suggest</button><button id="categoryToggle" class="cat-btn">☰ Categories</button></div>
</div></header>
<div id="overlay" class="overlay hidden"></div><aside id="sidebar" class="sidebar" aria-label="Categories"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="opacity:.6;font-size:11px;letter-spacing:.14em">BROWSE</div><h2 style="margin:3px 0 0">Game Categories</h2></div><button id="categoryClose" class="cat-btn" style="width:38px;padding:0">×</button></div><div id="catList" class="cat-list"></div></aside>
<main class="page"><section class="hero"><h1>Play games instantly</h1><p>Fast search, automatic categories, new-game ribbons, trending picks and a rotating homepage.</p></section>
<section class="featured"><h2>Trending Now</h2><div id="trendingStrip" class="strip"></div></section>
<section class="featured"><h2>New Games</h2><div id="newStrip" class="strip"></div></section>
<div id="status" class="status">Building your game library…</div><div id="gameGrid" class="game-grid"></div><div id="empty" class="empty hidden">No games matched your search.</div></main>
<footer><div>© 2026 All rights reserved.</div><div style="opacity:.75;font-size:12px;margin-top:5px">Game library updates automatically.</div></footer>
<script>
(() => {
'use strict';
const grid=document.getElementById('gameGrid'),status=document.getElementById('status'),empty=document.getElementById('empty'),search=document.getElementById('searchBar'),clear=document.getElementById('searchClear'),results=document.getElementById('searchResults'),trendStrip=document.getElementById('trendingStrip'),newStrip=document.getElementById('newStrip');
const cats=['All Games','New Games','Trending','Action','Adventure','Horror','Multiplayer','Fighting','Survival','Platformer','Racing','Sports','Puzzle','Arcade','Strategy','Simulation','Casual','Anime','Rhythm & Music','Card & Board','io'];
const rules={Action:['action','shooter','combat','battle','fight','war','zombie','ninja','stickman','assassin','gun','sniper','strike','rush','arena','brawler','fighter'],Adventure:['adventure','quest','platform','dungeon','maze','escape','explore','survival','island','parkour','treasure','mystery'],Arcade:['arcade','flappy','runner','run','jump','brick','ball','bubble','match','pinball','snake','pong','breakout','stack','tap'],Puzzle:['puzzle','logic','sudoku','2048','mahjong','word','memory','connect','block','brain','sort','merge','numbers','crossword'],Racing:['racing','race','drift','car','cars','motor','bike','bmx','kart','traffic','drive','rally','truck','rider'],Sports:['football','soccer','basketball','baseball','golf','tennis','hockey','volleyball','bowling','pool','sports','skate','ski','boxing','wrestling','cricket'],Strategy:['strategy','tower','defense','defence','battle','td','idle','tycoon','manager','kingdom','chess','checkers','empire','tactics'],Simulation:['simulator','simulation','farming','farm','restaurant','cooking','shop','business','city','hotel','airport','life','house','doctor','hospital','school'],Casual:['clicker','idle','dress','makeup','color','drawing','quiz','trivia','fun','cute','music','piano','matching','decorate'],Horror:['horror','scary','terror','creepy','nightmare','fnaf','freddy','five nights','evil','darkness','creepypasta'],Fighting:['fighting','fighter','duel','boxing','wrestle','street fighter','brawl'],Survival:['survival','zombie','raft','escape','last breath'],Platformer:['platformer','platform','mario','sonic','geometry dash','jump'],Anime:['pokemon','anime','sakura','naruto'],['Rhythm & Music']:['rhythm','music','fnf','friday night','piano','beat'],['Card & Board']:['chess','card','solitaire','poker','blackjack','mahjong'],io:['.io','io','agar','slither','paper io']};
let all=[],active='All Games',fourDay=Math.floor(Date.now()/345600000);
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function infer(name,meta){if(meta.local||/2 player|2-player|same device|local multiplayer|player 1|player 2/i.test(meta.text||''))return 'Multiplayer';let n=norm(name),best='Casual',score=0;for(const [c,ws] of Object.entries(rules)){let s=ws.reduce((a,w)=>a+(n.includes(norm(w))?1:0),0);if(s>score){score=s;best=c}}return best}
function addGame(g,seen){let title=String(g.title||g.name||'').trim(),url=String(g.url||'').trim(),image=String(g.image||g.cover||'').trim();if(!title||!url||!/^https?:\/\//i.test(url)||!image||seen.has(norm(title)))return false;seen.add(norm(title));all.push({title,url,image,category:infer(title,g),new:Boolean(g.new),seed:Boolean(g.seed)});return true}
function makeCard(g,compact=false){const c=document.createElement('div');c.className='game-card';c.dataset.category=g.category;c.dataset.new=g.new?'1':'0';c.dataset.seed=g.seed?'1':'0';c.onclick=()=>play(g);const img=document.createElement('img');img.src=g.image;img.alt=g.title;img.loading='lazy';img.referrerPolicy='no-referrer';const h=document.createElement('h3');h.textContent=g.title;c.append(img,h);return c}
function ribbons(c,g){const box=document.createElement('div');box.className='card-ribbons';if(g.new){const n=document.createElement('span');n.className='ribbon new';n.textContent='NEW';box.append(n)}if(g.seed){const t=document.createElement('span');t.className='ribbon trending';t.textContent='TRENDING';box.append(t)}if(box.children.length)c.append(box)}
function play(g){const w=window.open('about:blank','_blank');if(!w){location.href=g.url;return}const u=g.url.replace(/&/g,'&amp;').replace(/"/g,'&quot;');w.document.write('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Docs</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{width:100%;height:100%;border:0}</style></head><body><iframe src="'+u+'" allow="fullscreen;autoplay;gamepad;clipboard-read;clipboard-write" allowfullscreen></iframe></body></html>');w.document.close();recordTrend(g)}
function recordTrend(g){try{let h=JSON.parse(localStorage.getItem('ubg43_trend')||'{}');const k=norm(g.title);h[k]=(h[k]||[]).concat(Date.now()).slice(-50);localStorage.setItem('ubg43_trend',JSON.stringify(h))}catch(_){} }
function trendScore(g){try{const h=JSON.parse(localStorage.getItem('ubg43_trend')||'{}'),x=h[norm(g.title)]||[];return x.filter(t=>Date.now()-t<259200000).length}catch(_){return 0}}
function render(){grid.innerHTML='';const q=norm(search.value),hits=all.filter(g=>!q||norm(g.title).includes(q));const set=active==='All Games'?hits:active==='New Games'?hits.filter(g=>g.new):active==='Trending'?hits.filter(g=>g.seed||trendScore(g)>0):hits.filter(g=>g.category===active);hits.forEach(g=>{const c=makeCard(g);ribbons(c,g);c.style.display=set.includes(g)?'':'none';grid.append(c)});empty.classList.toggle('hidden',set.length>0);renderFeatured();renderCats()}
function renderFeatured(){trendStrip.innerHTML='';newStrip.innerHTML='';let trends=[...all].sort((a,b)=>trendScore(b)-trendScore(a)||Number(b.seed)-Number(a.seed)).slice(0,8);if(!trends.some(x=>x.seed))trends=all.filter(x=>x.seed).slice(0,8).concat(trends).slice(0,8);trends.forEach(g=>{const c=makeCard(g,true);ribbons(c,g);trendStrip.append(c)});all.filter(g=>g.new).slice(0,8).forEach(g=>{const c=makeCard(g,true);ribbons(c,g);newStrip.append(c)})}
function renderCats(){const list=document.getElementById('catList');list.innerHTML='';for(const c of cats){const n=c==='All Games'?all.length:c==='New Games'?all.filter(g=>g.new).length:c==='Trending'?all.filter(g=>g.seed||trendScore(g)>0).length:all.filter(g=>g.category===c).length;const b=document.createElement('button');b.className='cat'+(c===active?' active':'');b.innerHTML='<span></span><strong>'+c+'</strong><span>'+n+'</span>';b.onclick=()=>{active=c;document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.add('hidden');render()};list.append(b)}}
function suggestions(){results.innerHTML='';const q=norm(search.value);if(!q){results.classList.remove('open');return}all.filter(g=>norm(g.title).includes(q)).slice(0,6).forEach(g=>{const b=document.createElement('button');b.className='result';b.innerHTML='<img alt=""><span></span>';b.querySelector('img').src=g.image;b.querySelector('img').alt=g.title;b.querySelector('span').textContent=g.title;b.onclick=()=>{search.value=g.title;results.classList.remove('open');render()};results.append(b)});if(results.children.length)results.classList.add('open')}
async function load(){const seen=new Set();const initial=[['Friday Night Funkin','https://raw.githubusercontent.com/gn-math/html/main/475.html','https://raw.githubusercontent.com/gn-math/covers/main/475.png'],['Five Nights at Freddy\'s','https://raw.githubusercontent.com/gn-math/html/main/38-f.html','https://raw.githubusercontent.com/gn-math/covers/main/38.png'],['Slope','https://slopenexus.github.io/games/v1.2.5/index.html','https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRg6s6a6emcwYQe1rYlhZTqGy1tAPalZkkldw&s'],['Geometry Dash','https://ubg42.github.io/file/Geometry-Dash.html','https://assets-prd.ignimgs.com/2021/12/14/geometrydash-1639510868467.jpg'],['Basket Random','https://tylerpalko.github.io/gamehub/basketrandom/','https://avatars.githubusercontent.com/u/177211743?v=4'],['Moto X3M','https://ubg42.github.io/MotoX3MFunny1/','https://motox3m-free.github.io/data/image/game/moto-x3m-banner-game2.png'],['Run 3','https://ubg42.github.io/Run3/','https://nvshs.github.io/games/assets/run3.png'],['2048','https://sbeyer.github.io/2048','https://gabrielecirulli.github.io/2048/meta/og_image.png']];initial.forEach((x,i)=>addGame({title:x[0],url:x[1],image:x[2],new:i<3,seed:i<5},seen));try{const r=await fetch('legacy-index.html',{cache:'no-store'});if(r.ok){const d=new DOMParser().parseFromString(await r.text(),'text/html');d.querySelectorAll('#gameGrid > .game-card').forEach(c=>{const img=c.querySelector('img'),h=c.querySelector('h3'),m=(c.getAttribute('onclick')||'').match(/openGame\(['\"]([^'\"]+)/);if(h&&img&&m)addGame({title:h.textContent,url:m[1],image:img.getAttribute('src'),text:h.textContent,new:!!c.dataset.newSince},seen)})}}catch(_){}try{const z=await fetch('https://raw.githubusercontent.com/gn-math/assets/main/zones.json',{cache:'no-store'});if(z.ok){const zones=await z.json();const rows=zones.filter(x=>Number(x.id)>=0).slice(0,1400);for(const x of rows){const url=String(x.url||'').replace('{HTML_URL}','https://raw.githubusercontent.com/gn-math/html/main');const image=String(x.cover||'').replace('{COVER_URL}','https://raw.githubusercontent.com/gn-math/covers/main');addGame({name:x.name,url,image,text:x.name,new:true,seed:all.length<18},seen)}}}catch(_){}status.textContent=`${all.length} games loaded`;if(!all.length)status.textContent='Game library unavailable — refresh to retry';render()}
search.addEventListener('input',()=>{clear.style.display=search.value?'block':'none';suggestions();render()});clear.onclick=()=>{search.value='';clear.style.display='none';results.classList.remove('open');render();search.focus()};document.addEventListener('click',e=>{if(!e.target.closest('.search-shell'))results.classList.remove('open')});document.getElementById('randomGameButton').onclick=()=>{const q=search.value.trim(),pool=all.filter(g=>active==='All Games'?true:active==='New Games'?g.new:active==='Trending'?g.seed||trendScore(g)>0:g.category===active);const g=(pool.length?pool:all)[Math.floor(Math.random()*(pool.length?pool.length:all.length))];if(g)play(g)};document.getElementById('reportGameButton').onclick=()=>location.href='mailto:ubg423@gmail.com?subject=UBG%20Problem%20or%20Suggestion';document.getElementById('categoryToggle').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.remove('hidden');renderCats()};document.getElementById('categoryClose').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.add('hidden')};document.getElementById('overlay').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.add('hidden')};load();
})();
</script>
</body></html>
