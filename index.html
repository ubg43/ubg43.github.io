<script id="ubg43-direct-launch-runtime">
(()=>{
  'use strict';
  const openDirect=url=>{url=String(url||'').trim();if(!url)return;const w=window.open(url,'_blank','noopener,noreferrer');if(!w)window.location.href=url};
  window.openGame=openDirect;
  document.addEventListener('click',e=>{
    const card=e.target.closest('.game-card');
    if(!card)return;
    const a=card.getAttribute('onclick')||'';
    const m=a.match(/openGame\(\s*['\"]([^'\"]+)['\"]/i);
    if(!m)return;
    e.preventDefault();
    e.stopImmediatePropagation();
    openDirect(m[1]);
  },true);
})();
</script>

<script id="ubg43-four-day-runtime">
(function(){
  'use strict';
  function rotate(){
    var g=document.getElementById('gameGrid');if(!g||g.dataset.fourDayRotated==='1')return;
    var cs=Array.prototype.slice.call(g.querySelectorAll(':scope > .game-card'));if(cs.length<2)return;
    var bucket=Math.floor(Date.now()/(4*86400000));
    function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
    cs.forEach(function(c,i){var h=c.querySelector('h3');c.dataset.homeRank=String(hash((h?h.textContent:'')+'|'+bucket+'|'+i))});
    cs.sort(function(a,b){return Number(a.dataset.homeRank)-Number(b.dataset.homeRank)});
    cs.forEach(function(c){g.appendChild(c)});
    g.dataset.fourDayRotated='1';
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(rotate,400)});else setTimeout(rotate,400);
})();
</script>

<script id="ubg43-final-interactions-runtime">(()=>{
'use strict';
const $=id=>document.getElementById(id),grid=$('gameGrid'),search=$('searchBar'),clear=$('searchClear'),status=$('status');
if(!grid||!search)return;
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
let searchMode=false;
function cards(){return [...grid.querySelectorAll(':scope > .game-card')]}
function title(c){return (c.querySelector('h3')?.textContent||c.querySelector('img')?.alt||'Game').trim()}
function syncStatus(){if(!status)return;const q=norm(search.value);const n=cards().filter(c=>getComputedStyle(c).display!=='none').length;status.textContent=searchMode?(n?`Showing ${n} matching game${n===1?'':'s'}`:'No games matched your search.'):`${cards().length} games loaded`}
function orderSearch(){if(!searchMode)return;const parent=grid.parentNode,p=$('ubg43SearchPage'),r=$('v3Recommendations'),t=$('v3Trending'),n=$('v3New');[p,grid,r,t,n].filter(Boolean).forEach(x=>parent.appendChild(x));if(r){r.style.display='block';r.classList.remove('is-hidden')}}
function removeSearchPage(){const p=$('ubg43SearchPage');if(p)p.remove()}
function clearSearch(){searchMode=false;document.body.classList.remove('ubg43-search-active');cards().forEach(c=>c.style.display='');removeSearchPage();const r=$('v3Recommendations');if(r)r.remove();syncStatus();window.scrollTo({top:0,behavior:'smooth'})}
function showSearch(q){q=norm(q);if(!q){clearSearch();return}searchMode=true;document.body.classList.add('ubg43-search-active');let p=$('ubg43SearchPage');if(!p){p=document.createElement('section');p.id='ubg43SearchPage';p.className='search-page';grid.parentNode.insertBefore(p,grid)}const hits=cards().filter(c=>norm(title(c)).includes(q));cards().forEach(c=>{c.style.display=hits.includes(c)?'':'none'});p.innerHTML=`<h2>Search results</h2><p>Showing ${hits.length} game${hits.length===1?'':'s'} for “${String(q).replace(/[&<>]/g,'')}”. New Games and Trending Now stay available below.</p>`;const r=$('v3Recommendations');if(r){r.style.display='block';r.classList.remove('is-hidden')}orderSearch();syncStatus();p.scrollIntoView({behavior:'smooth',block:'start'})}
const report=$('reportGameButton');if(report)report.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();window.location.href='https://forms.gle/zXYtnxwXhGvXmBrq9'},true);
search.addEventListener('input',()=>{setTimeout(()=>{if(!norm(search.value))clearSearch();else if(!searchMode){cards().forEach(c=>c.style.display='');const r=$('v3Recommendations');if(r)r.style.display='none'}syncStatus()},35)});
search.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopImmediatePropagation();showSearch(search.value)}else if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();search.value='';if(clear)clear.style.display='none';clearSearch()}},true);
if(clear)clear.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();search.value='';clearSearch();search.focus()},true);
setTimeout(syncStatus,80);setTimeout(syncStatus,400);setTimeout(syncStatus,1200);
})();</script>
